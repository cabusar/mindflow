            function executeToolCall(toolName, args, state) {
                if (toolName !== "edit_mindmap") return { success: false, error: "Unknown tool" };
                const patches = [];
                const nextId = state.nodes.reduce((max, n) => Math.max(max, parseInt(n.id) || 0), 0) + 1;
                let currentId = nextId;
                for (const n of args.nodes_to_add || []) {
                    if (!n.id || !n.label) continue;
                    patches.push({ op: "add_node", id: n.id, label: n.label, color: n.color, shape: n.shape, x: n.x, y: n.y });
                    if (n.connect_to) patches.push({ op: "add_edge", source: n.connect_to, target: n.id });
                }
                for (const n of args.nodes_to_update || []) {
                    if (!n.id) continue;
                    patches.push({ op: "update_node", id: n.id, label: n.label, color: n.color, shape: n.shape, description: n.description });
                }
                for (const id of args.node_ids_to_delete || []) patches.push({ op: "delete_node", id });
                for (const e of args.edges_to_add || []) {
                    if (!e.source || !e.target) continue;
                    patches.push({ op: "add_edge", source: e.source, target: e.target, label: e.label, arrow: e.arrow !== false, sourceHandle: e.sourceHandle, targetHandle: e.targetHandle });
                }
                for (const e of args.edges_to_update || []) {
                    if (!e.id) continue;
                    patches.push({ op: "update_edge", id: e.id, label: e.label, arrow: e.arrow, sourceHandle: e.sourceHandle, targetHandle: e.targetHandle });
                }
                for (const id of args.edge_ids_to_delete || []) patches.push({ op: "delete_edge", id });
                if (!patches.length) return { success: false, error: "No changes specified" };
                const clean = patches.map((p) => { const c = { op: p.op }; for (const k of Object.keys(p)) { if (p[k] !== undefined) c[k] = p[k]; } return c; });
                const validation = validatePatches(clean, state);
                if (!validation.valid) return { success: false, error: validation.errors.join("; ") };
                const result = applyPatches(state, clean, currentId);
                return { success: true, newState: result };
            }

            async function* streamLLM(endpoint, model, key, messages, onThinking, externalSignal) {
                const url = endpoint.replace(/\/+$/, "") + "/chat/completions";
                const headers = { "Content-Type": "application/json" };
                if (key) headers["Authorization"] = "Bearer " + key;
                const body = JSON.stringify({ model: model || "", messages, tools: AI_TOOLS, tool_choice: "auto", temperature: 0.7, stream: true });
                const controller = new AbortController();
                if (externalSignal) externalSignal.addEventListener("abort", () => controller.abort());
                const timer = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
                try {
                    const resp = await fetch(url, { method: "POST", headers, body, signal: controller.signal });
                    if (!resp.ok) { const t = await resp.text().catch(() => ""); throw new Error("HTTP " + resp.status + (t ? " : " + t.slice(0, 200) : "")); }
                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "", toolCalls = {};
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n"); buffer = lines.pop() || "";
                        for (const line of lines) {
                            const t = line.trim();
                            if (!t || !t.startsWith("data: ")) continue;
                            const data = t.slice(6);
                            if (data === "[DONE]") break;
                            try {
                                const json = JSON.parse(data);
                                const delta = json.choices?.[0]?.delta;
                                if (!delta) continue;
                                if (delta.reasoning_content && onThinking) onThinking(delta.reasoning_content);
                                if (delta.content) yield { type: "text", text: delta.content };
                                if (delta.tool_calls) {
                                    for (const tc of delta.tool_calls) {
                                        const idx = tc.index;
                                        if (!toolCalls[idx]) toolCalls[idx] = { id: tc.id || "", name: "", arguments: "" };
                                        if (tc.id) toolCalls[idx].id = tc.id;
                                        if (tc.function?.name) toolCalls[idx].name += tc.function.name;
                                        if (tc.function?.arguments) toolCalls[idx].arguments += tc.function.arguments;
                                    }
                                }
                            } catch {}
                        }
                    }
                    const calls = Object.values(toolCalls).filter((tc) => tc.name);
                    if (calls.length) yield { type: "tool_calls", calls };
                } finally { clearTimeout(timer); }
            }

            async function callLLM(endpoint, model, key, prompt) {
                const url = endpoint.replace(/\/+$/, "") + "/chat/completions";
                const headers = { "Content-Type": "application/json" };
                if (key) headers["Authorization"] = "Bearer " + key;
                const body = JSON.stringify({ model: model || "", messages: [{ role: "user", content: prompt }], temperature: 0.7 });
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
                try {
                    const resp = await fetch(url, { method: "POST", headers, body, signal: controller.signal });
                    if (!resp.ok) throw new Error("HTTP " + resp.status);
                    const json = await resp.json();
                    return json.choices?.[0]?.message?.content ?? "";
                } finally { clearTimeout(timer); }
            }


                        function parsePatchResponse(text) {
                // Try to find a JSON array in the text
                const match = text.match(/\[[\s\S]*\]/);
                if (!match) return null;
                try {
                    const parsed = JSON.parse(match[0]);
                    if (!Array.isArray(parsed)) return null;
                    return parsed;
                } catch {
                    return null;
                }
            }

            /** Validate patches against the current state */
            function validatePatches(patches, state) {
                if (!Array.isArray(patches))
                    return {
                        valid: false,
                        errors: ["Format invalide : tableau attendu"],
                    };
                if (patches.length > AI_MAX_PATCHES)
                    return {
                        valid: false,
                        errors: [
                            "Trop d'op" +
                                "érations" +
                                " (" +
                                patches.length +
                                " > " +
                                AI_MAX_PATCHES +
                                ")",
                        ],
                    };
                const errors = [];
                const validOps = new Set([
                    "add_node",
                    "update_node",
                    "delete_node",
                    "add_edge",
                    "delete_edge",
                ]);
                const existingIds = new Set(state.nodes.map((n) => n.id));
                const existingEdgeIds = new Set(state.edges.map((e) => e.id));
                for (let i = 0; i < patches.length; i++) {
                    const p = patches[i];
                    if (!p || typeof p !== "object") {
                        errors.push("Patch " + i + " : expected object");
                        continue;
                    }
                    if (!validOps.has(p.op)) {
                        errors.push(
                            "Patch " +
                                i +
                                " : op" +
                                "ération" +
                                ' inconnue "' +
                                p.op +
                                '"',
                        );
                        continue;
                    }
                    if (p.op === "add_node") {
                        if (!p.id || typeof p.id !== "string")
                            errors.push("Patch " + i + " : missing id");
                        else if (existingIds.has(p.id))
                            errors.push(
                                "Patch " +
                                    i +
                                    ' : id "' +
                                    p.id +
                                    '" existe deja',
                            );
                        else {
                            existingIds.add(p.id);
                            existingEdgeIds.add(p.id);
                        }
                    }
                    if (p.op === "update_node" || p.op === "delete_node") {
                        if (!p.id || !existingIds.has(p.id))
                            errors.push(
                                "Patch " +
                                    i +
                                    ' : id "' +
                                    (p.id || "?") +
                                    '" introuvable',
                            );
                    }
                    if (p.op === "add_edge") {
                        if (!p.source || !existingIds.has(p.source))
                            errors.push(
                                "Patch " +
                                    i +
                                    ' : source "' +
                                    (p.source || "?") +
                                    '" introuvable. Ajoute ce nœud dans nodes_to_add d abord.',
                            );
                        if (!p.target || !existingIds.has(p.target))
                            errors.push(
                                "Patch " +
                                    i +
                                    ' : target "' +
                                    (p.target || "?") +
                                    '" introuvable. Ajoute ce nœud dans nodes_to_add d abord.',
                            );
                        if (p.source === p.target)
                            errors.push("Patch " + i + " : self-loop forbidden");
                    }
                    if (
                        p.op === "delete_edge" ||
                        p.op === "delete_edge_by_id"
                    ) {
                        if (!p.id || !existingEdgeIds.has(p.id))
                            errors.push(
                                "Patch " +
                                    i +
                                    ' : edge "' +
                                    (p.id || "?") +
                                    '" introuvable',
                            );
                    }
                }
                return { valid: errors.length === 0, errors };
            }
            /** Apply validated patches to state (pure function) */
            function applyPatches(state, patches, nextId) {
                let nodes = state.nodes;
                let edges = state.edges;
                let currentId = nextId;
                for (const p of patches) {
                    if (p.op === "add_node") {
                        const id = p.id || String(currentId++);
                        nodes = nodes.concat({
                            id,
                            type: "mind",
                            position: {
                                x: p.x ?? Math.random() * 200 - 100,
                                y: p.y ?? Math.random() * 200 - 100,
                            },
                            data: {
                                label: (p.label ?? "New node").slice(
                                    0,
                                    MAX_TEXT_LENGTH,
                                ),
                                color: COLORS.some((c) => c.name === p.color)
                                    ? p.color
                                    : COLORS[0].name,
                                shape: VALID_NODE_SHAPES.has(p.shape)
                                    ? p.shape
                                    : "rectangle",
                            },
                        });
                    }
                    if (p.op === "update_node") {
                        nodes = nodes.map((n) => {
                            if (n.id !== p.id) return n;
                            const data = { ...n.data };
                            if (p.label !== undefined)
                                data.label = sanitizeText(p.label);
                            if (
                                p.color !== undefined &&
                                COLORS.some((c) => c.name === p.color)
                            )
                                data.color = p.color;
                            if (
                                p.shape !== undefined &&
                                VALID_NODE_SHAPES.has(p.shape)
                            )
                                data.shape = p.shape;
                            if (p.description !== undefined)
                                data.description = sanitizeText(p.description);
                            return { ...n, data };
                        });
                    }
                    if (p.op === "delete_node") {
                        nodes = nodes.filter((n) => n.id !== p.id);
                        edges = edges.filter(
                            (e) => e.source !== p.id && e.target !== p.id,
                        );
                    }
                    if (p.op === "add_edge") {
                        const eid =
                            p.id ||
                            "e-" + p.source + "-" + p.target + "-" + Date.now();
                        if (
                            !edges.some(
                                (e) =>
                                    e.source === p.source &&
                                    e.target === p.target,
                            )
                        ) {
                            edges = addEdge(
                                makeEdge({
                                    id: eid,
                                    source: p.source,
                                    target: p.target,
                                }),
                                edges,
                            );
                        }
                    }
                    if (p.op === "update_edge") {
                        edges = edges.map((e) => {
                            if (e.id !== p.id) return e;
                            const updated = { ...e };
                            if (p.label !== undefined) updated.label = p.label;
                            if (p.arrow !== undefined) {
                                updated.markerEnd = p.arrow
                                    ? {
                                          type: MarkerType.ArrowClosed,
                                          color:
                                              e.style?.stroke || DEFAULT_STROKE,
                                      }
                                    : undefined;
                            }
                            return updated;
                        });
                    }
                    if (p.op === "delete_edge") {
                        edges = edges.filter((e) => e.id !== p.id);
                    }
                    if (p.op === "delete_edge_by_id") {
                        edges = edges.filter((e) => e.id !== p.id);
                    }
                    if (p.op === "delete_edge_by_nodes") {
                        edges = edges.filter(
                            (e) =>
                                !(
                                    e.source === p.source &&
                                    e.target === p.target
                                ),
                        );
                    }
                }
                return {
                    nodes,
                    edges,
                    canvasBg: state.canvasBg,
                    canvasDot: state.canvasDot,
                    nextId: currentId,
                };
            }

            function makeEdge(params) {
                const color = DEFAULT_STROKE;
                return {
                    ...params,
                    type: "smoothstep",
                    animated: true,
                    style: { stroke: color, strokeWidth: 2 },
                    ...(params.arrow !== false
                        ? { markerEnd: { type: MarkerType.ArrowClosed, color } }
                        : {}),
                };
            }

            function sanitizeText(value, fallback = "") {
                return typeof value === "string"
                    ? value.slice(0, MAX_TEXT_LENGTH)
                    : fallback;
            }

            /**
             * Normalize the persisted/exported document. This is the public schema
             * boundary: UI/transient React Flow fields are intentionally dropped.
             * @param {any} data
             * @returns {{_version: number, nodes: any[], edges: any[], canvasBg: string, canvasDot: string}}
             */
            function normalizeDocument(data) {
                const source =
                    typeof data === "object" && data !== null ? data : {};
                return {
                    _version: STORAGE_SCHEMA_VERSION,
                    nodes: (source.nodes ?? []).map((node) => {
                        const nodeData = node?.data ?? {};
                        const color = COLORS.some(
                            (preset) => preset.name === nodeData.color,
                        )
                            ? nodeData.color
                            : COLORS[0].name;
                        const shape = VALID_NODE_SHAPES.has(nodeData.shape)
                            ? nodeData.shape
                            : "rectangle";
                        return {
                            id: sanitizeText(node?.id),
                            type: VALID_NODE_TYPES.has(node?.type)
                                ? node.type
                                : "mind",
                            position: {
                                x: isFiniteNumber(node?.position?.x)
                                    ? node.position.x
                                    : 0,
                                y: isFiniteNumber(node?.position?.y)
                                    ? node.position.y
                                    : 0,
                            },
                            data: {
                                label: sanitizeText(nodeData.label),
                                color,
                                ...(nodeData.description !== undefined
                                    ? {
                                          description: sanitizeText(
                                              nodeData.description,
                                          ),
                                      }
                                    : {}),
                                shape,
                                ...(isHexColor(nodeData.bg)
                                    ? { bg: nodeData.bg }
                                    : {}),
                                ...(isHexColor(nodeData.border)
                                    ? { border: nodeData.border }
                                    : {}),
                            },
                        };
                    }),
                    edges: (source.edges ?? []).map((edge) => {
                        const stroke = isHexColor(edge?.style?.stroke)
                            ? edge.style.stroke
                            : DEFAULT_STROKE;
                        const strokeWidth =
                            isFiniteNumber(edge?.style?.strokeWidth) &&
                            edge.style.strokeWidth >= 1 &&
                            edge.style.strokeWidth <= 20
                                ? edge.style.strokeWidth
                                : 2;
                        const markerColor = isHexColor(edge?.markerEnd?.color)
                            ? edge.markerEnd.color
                            : stroke;
                        return {
                            id: sanitizeText(edge?.id),
                            source: sanitizeText(edge?.source),
                            target: sanitizeText(edge?.target),
                            ...(HANDLE_ID_RE.test(edge?.sourceHandle)
                                ? { sourceHandle: edge.sourceHandle }
                                : {}),
                            ...(HANDLE_ID_RE.test(edge?.targetHandle)
                                ? { targetHandle: edge.targetHandle }
                                : {}),
                            type: VALID_EDGE_TYPES.has(edge?.type)
                                ? edge.type
                                : "smoothstep",
                            animated: !!edge?.animated,
                            ...(edge?.label !== undefined
                                ? { label: sanitizeText(edge.label) }
                                : {}),
                            style: { stroke, strokeWidth },
                            ...(edge?.markerEnd
                                ? {
                                      markerEnd: {
                                          type: MarkerType.ArrowClosed,
                                          color: markerColor,
                                      },
                                  }
                                : edge?.markerEnd === null
                                  ? { markerEnd: null }
                                  : {}),
                        };
                    }),
                    canvasBg: isHexColor(source.canvasBg)
                        ? source.canvasBg
                        : CANVAS_BG_PRESETS[0].bg,
                    canvasDot: isHexColor(source.canvasDot)
                        ? source.canvasDot
                        : CANVAS_BG_PRESETS[0].dot,
                };
            }

            function createDefaultDocument() {
                return normalizeDocument({
                    nodes: initialNodes,
                    edges: initialEdges,
                    canvasBg: CANVAS_BG_PRESETS[0].bg,
                    canvasDot: CANVAS_BG_PRESETS[0].dot,
                });
            }

            function documentToAppState(document) {
                const normalized = normalizeDocument(document);
                return {
                    nodes: deepClone(normalized.nodes),
                    edges: deepClone(normalized.edges),
                    canvasBg: normalized.canvasBg,
                    canvasDot: normalized.canvasDot,
                };
            }

            function appStateToDocument(state) {
                return normalizeDocument(state);
            }

            function createDefaultState() {
                return documentToAppState(createDefaultDocument());
            }

            function createInitialState() {
                // Return null to avoid flashing the default document.
                // App() shows a loading overlay until the real document
                // is loaded asynchronously from IndexedDB/localStorage.
                return null;
            }

            function getNextNodeId(nodes) {
                return (
                    nodes.reduce(
                        (max, node) =>
                            Math.max(max, Number.parseInt(node.id, 10) || 0),
                        0,
                    ) + 1
                );
            }

            /**
             * Pure state reducer for domain-level mindmap actions. React Flow's low
             * level node/edge changes can still use their dedicated helpers, but app
             * actions should increasingly go through this boundary.
             * @param {{nodes: any[], edges: any[], canvasBg: string, canvasDot: string}} state
             * @param {any} action
             * @returns {{nodes: any[], edges: any[], canvasBg: string, canvasDot: string}}
             */
            function reduceMindmapState(state, action) {
                switch (action.type) {
                    case "ADD_NODE":
                        return {
                            ...state,
                            nodes: state.nodes.concat(action.node),
                        };
                    case "DUPLICATE_NODE": {
                        const original = state.nodes.find(
                            (n) => n.id === action.sourceNodeId,
                        );
                        if (!original) return state;
                        const offset = action.offset ?? DUPLICATE_OFFSET_PX;
                        return {
                            ...state,
                            nodes: state.nodes.concat({
                                id: action.newNodeId,
                                type: "mind",
                                position: {
                                    x: original.position.x + offset,
                                    y: original.position.y + offset,
                                },
                                data: {
                                    label: original.data.label,
                                    color: original.data.color,
                                    bg: original.data.bg,
                                    border: original.data.border,
                                    description: original.data.description,
                                    shape: original.data.shape,
                                },
                            }),
                        };
                    }
                    case "UPDATE_NODE_DATA":
                        return {
                            ...state,
                            nodes: state.nodes.map((n) =>
                                n.id === action.id
                                    ? {
                                          ...n,
                                          data: { ...n.data, ...action.patch },
                                      }
                                    : n,
                            ),
                        };
                    case "DELETE_NODE":
                        return {
                            ...state,
                            nodes: state.nodes.filter(
                                (n) => n.id !== action.id,
                            ),
                            edges: state.edges.filter(
                                (e) =>
                                    e.source !== action.id &&
                                    e.target !== action.id,
                            ),
                        };
                    case "ADD_EDGE":
                        return {
                            ...state,
                            edges: addEdge(
                                action.edge ?? makeEdge(action.params),
                                state.edges,
                            ),
                        };
                    case "UPDATE_EDGE":
                        return {
                            ...state,
                            edges: state.edges.map((e) => {
                                if (e.id !== action.id) return e;
                                const merged = { ...e, ...action.patch };
                                if (action.patch.style?.stroke) {
                                    merged.markerEnd = merged.markerEnd
                                        ? {
                                              ...merged.markerEnd,
                                              color: action.patch.style.stroke,
                                          }
                                        : merged.markerEnd;
                                }
                                return merged;
                            }),
                        };
                    case "DELETE_EDGE":
                        return {
                            ...state,
                            edges: state.edges.filter(
                                (e) => e.id !== action.id,
                            ),
                        };
                    case "UPDATE_CANVAS":
                        return { ...state, ...action.patch };
                    case "IMPORT_DOCUMENT":
                        return documentToAppState(action.document);
                    case "RESET_DOCUMENT":
                        return documentToAppState(
                            action.document ?? createDefaultDocument(),
                        );
                    default:
                        return state;
                }
            }

            // ---------------------------------------------------------------------
            // ---- App shell ----
            // ---------------------------------------------------------------------

            function App() {
                const [state, setState] = useState(createInitialState);
                const nodes = state?.nodes ?? [];
                const edges = state?.edges ?? [];
                const canvasBg = state?.canvasBg ?? CANVAS_BG_PRESETS[0].bg;
                const canvasDot = state?.canvasDot ?? CANVAS_BG_PRESETS[0].dot;
                const [isLoading, setIsLoading] = useState(true);
                const [storageMode, setStorageMode] = useState(null);
                const [gridSnap, setGridSnap] = useState(true);
                const [gridSize, setGridSize] = useState(GRID_CELL_SIZE);
                const [pngWatermark, setPngWatermark] = useState(true);
                const [exportingPng, setExportingPng] = useState(false);
                const [aiSidebarOpen, setAiSidebarOpen] = useState(false);
                const [aiProviders, setAiProviders] = useState(loadAiProviders);
                const [activeProviderId, setActiveProviderId] =
                    useState(loadActiveProviderId);
                const [aiMessages, setAiMessages] = useState([]);
                const aiSidebarRef = useRef(null);
                const [canUndo, setCanUndo] = useState(false);
                const [canRedo, setCanRedo] = useState(false);

                const [lang, setLang] = useState(() => {
                    try {
                        const stored = localStorage.getItem(LANG_STORAGE_KEY);
                        return stored === "fr" ? "fr" : "en";
                    } catch {
                        return "en";
                    }
                });

                // Persist language preference
                useEffect(() => {
                    try {
                        localStorage.setItem(LANG_STORAGE_KEY, lang);
                    } catch {}
                }, [lang]);

                // Theme (dark/light)
                const [theme, setTheme] = useState(() => {
                    try {
                        const stored = localStorage.getItem("mindmap.theme");
                        if (stored === "dark" || stored === "light")
                            return stored;
                    } catch {}
                    return window.matchMedia("(prefers-color-scheme: dark)")
                        .matches
                        ? "dark"
                        : "light";
                });

                const themeInitRef = useRef(true);
                useEffect(() => {
                    document.documentElement.setAttribute("data-theme", theme);
                    try {
                        localStorage.setItem("mindmap.theme", theme);
                    } catch {}
                    // Auto-adapt canvas background to match theme (skip initial mount)
                    if (themeInitRef.current) {
                        themeInitRef.current = false;
                    } else {
                        if (theme === "dark") {
                            setCanvasBg(CANVAS_BG_PRESETS[3].bg);
                            setCanvasDot(CANVAS_BG_PRESETS[3].dot);
                        } else {
                            setCanvasBg(CANVAS_BG_PRESETS[0].bg);
                            setCanvasDot(CANVAS_BG_PRESETS[0].dot);
                        }
                    }
                    const meta = document.querySelector(
                        'meta[name="theme-color"]',
                    );
                    if (meta)
                        meta.content =
                            theme === "dark"
                                ? "#1a1a1a"
                                : CANVAS_BG_PRESETS[0].bg;
                }, [theme]);

                // Dynamic meta theme-color
                useEffect(() => {
                    const meta = document.querySelector(
                        'meta[name="theme-color"]',
                    );
                    if (meta) meta.content = canvasBg;
                }, [canvasBg]);

                // Project list state
                const [docs, setDocs] = useState([]);
                const [activeDocId, setActiveDocId] = useState(null);
                const [drawerOpen, setDrawerOpen] = useState(false);
                const docsRef = useRef(docs);
                const activeDocIdRef = useRef(activeDocId);
                useEffect(() => {
                    docsRef.current = docs;
                }, [docs]);
                useEffect(() => {
                    activeDocIdRef.current = activeDocId;
                }, [activeDocId]);

                // Load project list + active document from IndexedDB
                useEffect(() => {
                    let cancelled = false;
                    (async () => {
                        try {
                            setStorageMode("idb");
                            // Attempt legacy migration first
                            await migrateLegacyIfNeeded();
                            let meta = await loadDocMeta();
                            if (!meta.docs.length) {
                                // No docs at all: create first one
                                const id = uid();
                                const defaultDoc = normalizeDocument(
                                    createDefaultDocument(),
                                );
                                await saveDocById(id, defaultDoc);
                                meta = {
                                    activeDocId: id,
                                    docs: [
                                        {
                                            id,
                                            name: t(lang, "unnamed"),
                                            createdAt: new Date().toISOString(),
                                            updatedAt: new Date().toISOString(),
                                            nodeCount: defaultDoc.nodes.length,
                                            edgeCount: defaultDoc.edges.length,
                                        },
                                    ],
                                };
                                const saved = await saveDocMeta(meta);
                            }
                            if (cancelled) return;
                            setDocs([...meta.docs]);
                            const activeId =
                                meta.activeDocId || meta.docs[0].id;
                            setActiveDocId(activeId);
                            const docData = await loadDocById(activeId);
                            if (docData && docData.nodes) {
                                const appState = documentToAppState(docData);
                                setState(appState);
                                idRef.current = getNextNodeId(appState.nodes);
                                // Load chat history
                                try {
                                    const chatData = await loadDocById(
                                        activeId + ":chat",
                                    );
                                    if (chatData?.messages)
                                        setAiMessages(chatData.messages);
                                } catch {}
                            } else {
                                setState(createDefaultState());
                            }
                        } catch {
                            if (!cancelled) {
                                setState(createDefaultState());
                                setStorageMode("local");
                            }
                        } finally {
                            if (!cancelled) setIsLoading(false);
                        }
                    })();
                    return () => {
                        cancelled = true;
                    };
                }, []);

                // History manager for explicit commits and undo/redo.
                // Initialized synchronously on first render where state is non-null,
                // to avoid race conditions with commitState which may be called
                // before effects run.
                const historyRef = useRef(null);
                if (historyRef.current === null && state !== null) {
                    historyRef.current = createHistoryManager(state);
                }
                const historyDebounceRef = useRef(null);
                const pendingHistoryBaseRef = useRef(null);
                const pendingHistoryNextRef = useRef(null);

                const flushPendingHistory = useCallback((fallbackState) => {
                    clearTimeout(historyDebounceRef.current);
                    const base = pendingHistoryBaseRef.current;
                    const next = pendingHistoryNextRef.current ?? fallbackState;
                    if (base && next) {
                        historyRef.current.setState(base);
                        historyRef.current.push(next);
                    }
                    pendingHistoryBaseRef.current = null;
                    pendingHistoryNextRef.current = null;
                }, []);

                const commitState = useCallback(
                    (updater, options = {}) => {
                        const historyMode = options.history ?? "immediate";
                        setState((prev) => {
                            const next =
                                typeof updater === "function"
                                    ? updater(prev)
                                    : updater;
                            if (next === prev) return prev;

                            if (historyMode === "debounced") {
                                if (pendingHistoryBaseRef.current === null) {
                                    pendingHistoryBaseRef.current = prev;
                                }
                                pendingHistoryNextRef.current = next;
                                clearTimeout(historyDebounceRef.current);
                                historyDebounceRef.current = setTimeout(
                                    () => flushPendingHistory(),
                                    HISTORY_DEBOUNCE_MS,
                                );
                                return next;
                            }

                            if (historyMode === "replace") {
                                flushPendingHistory(prev);
                                historyRef.current.setState(next);
                                return next;
                            }

                            flushPendingHistory(prev);
                            historyRef.current.setState(prev);
                            historyRef.current.push(next);
                            return next;
                        });
                    },
                    [flushPendingHistory],
                );

                const dispatchMindmapAction = useCallback(
                    (action, options) => {
                        commitState(
                            (prev) => reduceMindmapState(prev, action),
                            options,
                        );
                    },
                    [commitState],
                );

                // Backward-compatible wrappers so low-level React Flow changes keep working.
                const setNodes = useCallback(
                    (updater) =>
                        commitState(
                            (prev) => ({
                                ...prev,
                                nodes:
                                    typeof updater === "function"
                                        ? updater(prev.nodes)
                                        : updater,
                            }),
                            { history: "debounced" },
                        ),
                    [commitState],
                );
                const setEdges = useCallback(
                    (updater) =>
                        commitState(
                            (prev) => ({
                                ...prev,
                                edges:
                                    typeof updater === "function"
                                        ? updater(prev.edges)
                                        : updater,
                            }),
                            { history: "debounced" },
                        ),
                    [commitState],
                );
                const setCanvasBg = useCallback(
                    (val) =>
                        dispatchMindmapAction({
                            type: "UPDATE_CANVAS",
                            patch: { canvasBg: val },
                        }),
                    [dispatchMindmapAction],
                );
                const setCanvasDot = useCallback(
                    (val) =>
                        dispatchMindmapAction({
                            type: "UPDATE_CANVAS",
                            patch: { canvasDot: val },
                        }),
                    [dispatchMindmapAction],
                );

                const [selectedNodeId, setSelectedNodeId] = useState(null);
                const [selectedEdgeId, setSelectedEdgeId] = useState(null);
                const [importError, setImportError] = useState(null); // Error message from import validation (Req 4)
                const importErrorTimerRef = useRef(null); // Auto-clear import error after 5s
                const [resetArmed, setResetArmed] = useState(false);
                const resetTimerRef = useRef(null);
                // Req 8: Panel visibility toggle with persistence
                const [panelVisible, setPanelVisible] = useState(() => {
                    try {
                        const stored = localStorage.getItem(
                            PANEL_VISIBILITY_STORAGE_KEY,
                        );
                        return stored !== null ? stored === "true" : true;
                    } catch {
                        return true;
                    }
                });

                // P1.4: Hint visibility state with auto-hide and persistence
                const [hintVisible, setHintVisible] = useState(() => {
                    try {
                        const hidden = localStorage.getItem(HINT_STORAGE_KEY);
                        return hidden !== "true";
                    } catch {
                        return true;
                    }
                });
                const hintTimerRef = useRef(null);
                const dismissHint = useCallback(() => {
                    setHintVisible(false);
                    clearTimeout(hintTimerRef.current);
                    try {
                        localStorage.setItem(HINT_STORAGE_KEY, "true");
                    } catch {}
                }, []);
                const showHint = useCallback(() => {
                    setHintVisible(true);
                    clearTimeout(hintTimerRef.current);
                    try {
                        localStorage.removeItem(HINT_STORAGE_KEY);
                    } catch {}
                }, []);
                // Auto-hide hint after delay
                useEffect(() => {
                    if (!hintVisible) return;
                    clearTimeout(hintTimerRef.current);
                    hintTimerRef.current = setTimeout(
                        () => setHintVisible(false),
                        HINT_AUTO_HIDE_MS,
                    );
                    return () => clearTimeout(hintTimerRef.current);
                }, [hintVisible]);

                const idRef = useRef(null);
                if (idRef.current === null) {
                    idRef.current = getNextNodeId(nodes);
                }
                const rfRef = useRef(null);
                const clipboardRef = useRef(null);
                const canvasRef = useRef(null);
                const edgeLabelRef = useRef(null); // For focusing edge label input on double-click
                // P0.3: Track zoom level for status bar
                const [zoom, setZoom] = useState(1);
                const nodesRef = useRef(nodes);
                const edgesRef = useRef(edges);
                const selectedNodeIdRef = useRef(selectedNodeId);
                const panelVisibleRef = useRef(panelVisible);
                const [guides, setGuides] = useState([]); // [{axis:'v'|'h', pos, span:[a,b]}]

                useEffect(() => {
                    nodesRef.current = nodes;
                    edgesRef.current = edges;
                    selectedNodeIdRef.current = selectedNodeId;
                    panelVisibleRef.current = panelVisible;
                }, [nodes, edges, selectedNodeId, panelVisible]);

                useEffect(() => () => clearTimeout(resetTimerRef.current), []);

                // Sync the body bg so the area outside the React Flow canvas matches.
                useEffect(() => {
                    document.body.style.background = canvasBg;
                    return () => {
                        document.body.style.background = "";
                    };
                }, [canvasBg]);

                // Autosave on every change with visual feedback.
                // Debounced so a burst of edits produces a single write.
                const [saveStatus, setSaveStatus] = useState(null); // 'success' | 'error' | null
                const saveTimerRef = useRef(null);

                const showSaveIndicator = useCallback((status) => {
                    clearTimeout(saveTimerRef.current);
                    setSaveStatus(status);
                    saveTimerRef.current = setTimeout(
                        () => setSaveStatus(null),
                        TOAST_DURATION_MS,
                    );
                }, []);

                // Skip autosave while initial load is in progress
                const shouldAutosave = !isLoading;

                // Autosave debounced to avoid excessive writes during drags.
                // Uses IndexedDB when available (P4-14), falling back to localStorage.
                const autosaveTimerRef = useRef(null);
                useEffect(() => {
                    clearTimeout(autosaveTimerRef.current);
                    const docId = activeDocIdRef.current;
                    if (!docId) return;
                    autosaveTimerRef.current = setTimeout(async () => {
                        const document = appStateToDocument({
                            nodes,
                            edges,
                            canvasBg,
                            canvasDot,
                        });
                        const ok = await saveDocById(docId, document);
                        // Save chat history alongside document
                        try {
                            await saveDocById(docId + ":chat", {
                                messages: aiMessages,
                            });
                        } catch {}
                        // Update metadata (name stays, counts + date update)
                        const meta = await loadDocMeta();
                        const idx = meta.docs.findIndex((d) => d.id === docId);
                        if (idx >= 0) {
                            meta.docs[idx].nodeCount = nodes.length;
                            meta.docs[idx].edgeCount = edges.length;
                            meta.docs[idx].updatedAt = new Date().toISOString();
                            meta.activeDocId = docId;
                            await saveDocMeta(meta);
                            if (autosaveMountedRef.current)
                                setDocs([...meta.docs]);
                        }
                        if (ok) {
                            showSaveIndicator("success");
                        } else {
                            try {
                                localStorage.setItem(
                                    STORAGE_KEY,
                                    JSON.stringify(document),
                                );
                                showSaveIndicator("success");
                            } catch {
                                showSaveIndicator("error");
                            }
                        }
                    }, AUTOSAVE_DELAY_MS);
                    return () => {
                        clearTimeout(autosaveTimerRef.current);
                    };
                }, [
                    nodes,
                    edges,
                    canvasBg,
                    canvasDot,
                    showSaveIndicator,
                    shouldAutosave,
                ]);

                // Track whether autosave effect is still mounted
                const autosaveMountedRef = useRef(true);
                useEffect(() => {
                    autosaveMountedRef.current = true;
                    return () => {
                        autosaveMountedRef.current = false;
                    };
                }, []);

                useEffect(
                    () => () => {
                        clearTimeout(saveTimerRef.current);
                        clearTimeout(importErrorTimerRef.current);
                        clearTimeout(historyDebounceRef.current);
                    },
                    [],
                );

                // Undo/Redo functions
                const undo = useCallback(() => {
                    flushPendingHistory(state);
                    const prevState = historyRef.current.undo();
                    if (prevState) {
                        setState(prevState);
                    }
                    setCanUndo(historyRef.current.canUndo());
                    setCanRedo(historyRef.current.canRedo());
                }, [flushPendingHistory, state]);

                const redo = useCallback(() => {
                    flushPendingHistory(state);
                    const nextState = historyRef.current.redo();
                    if (nextState) {
                        setState(nextState);
                    }
                    setCanUndo(historyRef.current.canUndo());
                    setCanRedo(historyRef.current.canRedo());
                }, [flushPendingHistory, state]);

                // ---- Project CRUD ----
                const switchToDoc = useCallback(

                // ---- Alignment guides (Visio-style) -------------------------------
                // nodeBox + computeSnap are now at module scope (Req 11: testability).
                const nodeBoxes = useMemo(() => nodes.map(nodeBox), [nodes]);

                const onNodeDrag = useCallback(
                    (_e, draggedNode) => {
                        const others = nodeBoxes.filter(
                            (box) => box.id !== draggedNode.id,
                        );
                        if (!others.length) {
                            setGuides([]);
                            return;
                        }
                        const { drag, dx, dy, vCands, hCands } = computeSnap(
                            draggedNode,
                            others,
                        );

                        // NOTE: we deliberately do NOT mutate node positions here. React
                        // Flow's drag controller drives the position from the pointer on
                        // every frame, so any setNodes we do gets overwritten on the next
                        // event and — worse — the final position on mouseup is the raw
                        // pointer position (the snap "slips" by 1–4 px, which is the bug
                        // the user reported). We only show guides while dragging; the snap
                        // itself is committed once in onNodeDragStop below.

                        // Build guide line spans on the snapped box (preview only).
                        const draggedSnapped = {
                            ...drag,
                            x: drag.x + dx,
                            cx: drag.cx + dx,
                            r: drag.r + dx,
                            y: drag.y + dy,
                            cy: drag.cy + dy,
                            b: drag.b + dy,
                        };
                        const vLines = [];
                        const hLines = [];
                        for (const c of vCands) {
                            const xPos = c[1];
                            const aligned = [
                                draggedSnapped.x,
                                draggedSnapped.cx,
                                draggedSnapped.r,
                            ].some((dx2) => Math.abs(dx2 - xPos) <= 0.5);
                            if (aligned) {
                                const t = c[2];
                                const top = Math.min(draggedSnapped.y, t.y);
                                const bot = Math.max(draggedSnapped.b, t.b);
                                vLines.push({
                                    axis: "v",
                                    pos: xPos,
                                    span: [top, bot],
                                });
                            }
                        }
                        for (const c of hCands) {
                            const yPos = c[1];
                            const aligned = [
                                draggedSnapped.y,
                                draggedSnapped.cy,
                                draggedSnapped.b,
                            ].some((dy2) => Math.abs(dy2 - yPos) <= 0.5);
                            if (aligned) {
                                const t = c[2];
                                const left = Math.min(draggedSnapped.x, t.x);
                                const right = Math.max(draggedSnapped.r, t.r);
                                hLines.push({
                                    axis: "h",
                                    pos: yPos,
                                    span: [left, right],
                                });
                            }
                        }
                        // Dedupe by (axis,pos) keeping widest span.
                        const byKey = new Map();
                        for (const g of [...vLines, ...hLines]) {
                            const key = `${g.axis}|${g.pos.toFixed(2)}`;
                            const prev = byKey.get(key);
                            if (!prev) {
                                byKey.set(key, g);
                                continue;
                            }
                            prev.span[0] = Math.min(prev.span[0], g.span[0]);
                            prev.span[1] = Math.max(prev.span[1], g.span[1]);
                        }
                        setGuides(Array.from(byKey.values()));

                    [nodeBoxes],

                    const bounds = getNodesBounds(nodes);
                    let width = Math.ceil(bounds.width + PADDING * 2);

                    let zoom = 1;

                    try {

                        importErrorTimerRef.current = setTimeout(

                            IMPORT_ERROR_DURATION_MS,
