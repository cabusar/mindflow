                    [nodes, selectedNodeId],
                );
                const selectedEdge = useMemo(
                    () => edges.find((e) => e.id === selectedEdgeId) ?? null,
                    [edges, selectedEdgeId],
                );

                // Panels are rendered via mono-file internal components.

                // Focus trap for mobile panel
                useEffect(() => {
                    if (!panelVisible || window.innerWidth > 768) return;
                    const panel = document.querySelector(
                        ".panel-wrapper .panel",
                    );
                    if (!panel) return;
                    const focusable = panel.querySelectorAll(
                        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
                    );
                    if (!focusable.length) return;
                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];
                    const trap = (e) => {
                        if (e.key !== "Tab") return;
                        if (e.shiftKey && document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        } else if (
                            !e.shiftKey &&
                            document.activeElement === last
                        ) {
                            e.preventDefault();
                            first.focus();
                        }
                    };
                    panel.addEventListener("keydown", trap);
                    // Focus first element on open
                    setTimeout(() => first.focus(), 100);
                    return () => panel.removeEventListener("keydown", trap);
                }, [panelVisible]);

                // Req 8: Persist panel visibility
                useEffect(() => {
                    try {
                        localStorage.setItem(
                            PANEL_VISIBILITY_STORAGE_KEY,
                            String(panelVisible),
                        );
                    } catch {}
                }, [panelVisible]);

                const panel = selectedEdge
                    ? h(EdgePanel, {
                          selectedEdge,
                          nodes,
                          updateEdge,
                          deleteEdge,
                          edgeLabelRef,
                          lang,
                      })
                    : selectedNode
                      ? h(NodePanel, {
                            selectedNode,
                            updateNodeData,
                            deleteNode,
                            lang,
                        })
                      : h(CanvasPanel, {
                            canvasBg,
                            canvasDot,
                            setCanvasBg,
                            setCanvasDot,
                            gridSnap,
                            setGridSnap,
                            gridSize,
                            setGridSize,
                            pngWatermark,
                            setPngWatermark,
                            nodeCount: nodes.length,
                            edgeCount: edges.length,
                            nodes,
                            edges,
                            lang,
                            setLang,
                        });

                return h(
                    "div",
                    {
                        id: "app-root",
                        className: panelVisible
                            ? "panel-visible"
                            : "panel-hidden",
                    },
                    // P0.2: Mobile backdrop
                    h("div", {
                        className: "panel-backdrop",
                        onClick: () => setPanelVisible(false),
                    }),
                    h(
                        "div",
                        { className: "canvas", ref: canvasRef },
                        h(Toolbar, {
                            onAddNode: addNode,
                            onExportPng: exportPng,
                            onExportJson: exportJson,
                            onImportJson: importJson,
                            onReset: reset,
                            resetArmed,
                            panelVisible,
                            onTogglePanel: () => setPanelVisible((v) => !v),
                            onToggleDrawer: () => setDrawerOpen(true),
                            onToggleAi: () => setAiSidebarOpen((v) => !v),
                            onUndo: undo,
                            onRedo: redo,
                            canUndo,
                            canRedo,
                            onToggleTheme: () =>
                                setTheme((t) =>
                                    t === "dark" ? "light" : "dark",
                                ),
                            theme,
                            nodeCount: nodes.length,
                            docCount: docs.length,
                            activeDocName:
                                docs.find((d) => d.id === activeDocId)?.name ??
                                "",
                            lang,
                        }),

                        h(ShortcutHint, {
                            visible: hintVisible,
                            onDismiss: dismissHint,
                            onShow: showHint,
                            lang,
                        }),
                        h(SaveIndicator, { status: saveStatus, lang }),
                        h(ImportErrorToast, { message: importError, lang }),
                        // Req 9: ARIA role on the canvas
                        h(
                            ReactFlow,
                            {
                                "aria-label": t(lang, "a11yLabel"),
                                nodes: decoratedNodes,
                                edges,
                                nodeTypes,
                                onNodesChange,
                                onEdgesChange,
                                onConnect,
                                onEdgeDoubleClick,
                                onSelectionChange,
                                onNodeDrag,
                                onNodeDragStop,
                                onInit: (instance) =>
                                    (rfRef.current = instance),
                                onMove: (viewport) => {
                                    if (
                                        viewport &&
                                        typeof viewport.zoom === "number" &&
                                        !isNaN(viewport.zoom)
                                    ) {
                                        setZoom(viewport.zoom);
                                    }
                                },
                                fitView: true,
                                deleteKeyCode: ["Backspace", "Delete"],
                                selectionKeyCode: ["Shift"],
                                multiSelectionKeyCode: ["Shift"],
                                selectionMode: "partial",
                                snapToGrid: gridSnap,
                                snapGrid: [gridSize, gridSize],
                                connectionLineStyle: {
                                    stroke: "#1e40af",
                                    strokeWidth: 2,
                                    strokeDasharray: "5 5",
                                },
                                connectionRadius: 20,
                                isValidConnection: (connection) => {
                                    // Prevent self-connections
                                    if (connection.source === connection.target)
                                        return false;
                                    // Prevent duplicate edges
                                    const exists = edgesRef.current.some(
                                        (e) =>
                                            e.source === connection.source &&
                                            e.target === connection.target &&
                                            e.sourceHandle ===
                                                connection.sourceHandle &&
                                            e.targetHandle ===
                                                connection.targetHandle,
                                    );
                                    return !exists;
                                },
                                onEdgeUpdate: (oldEdge, newConnection) => {
                                    setEdges((els) =>
                                        els.map((e) =>
                                            e.id === oldEdge.id
                                                ? {
                                                      ...e,
                                                      source: newConnection.source,
                                                      target: newConnection.target,
                                                      sourceHandle:
                                                          newConnection.sourceHandle,
                                                      targetHandle:
                                                          newConnection.targetHandle,
                                                  }
                                                : e,
                                        ),
                                    );
                                },
                                proOptions: { hideAttribution: true },
                            },
                            h(Background, {
                                gap: 16,
                                color: canvasDot,
                                style: { background: canvasBg },
                            }),
                            h(Controls, null),
                            h(MiniMap, { pannable: true, zoomable: true }),
                            h(AlignmentGuides, { guides }),
                        ),
                    ),
                    // AI panel
                    h(AiSidebar, {
                        open: aiSidebarOpen && !isLoading,
                        nodes,
                        edges,
                        selectedNodeId,
                        lang,
                        activeDocId,
                        aiProviders,
                        setAiProviders,
                        activeProviderId,
                        setActiveProviderId,
                        aiMessages,
                        setAiMessages,
                        onClose: () => setAiSidebarOpen(false),
                        onApplyPatches,
                    }),
                    // Project drawer
                    h(ProjectDrawer, {
                        open: drawerOpen && !isLoading,
                        docs,
                        activeDocId,
                        onOpen: switchToDoc,
                        onNew: createNewDoc,
                        onDuplicate: duplicateDoc,
                        onRename: renameDoc,
                        onDelete: deleteProject,
                        onClose: () => setDrawerOpen(false),
                        onImport: importJson,
                        lang,
                    }),
                    // P1.6: Loading overlay
                    isLoading
                        ? h(
                              "div",
                              { className: "loading-overlay" },
                              h("div", { className: "loading-spinner" }),
                              t(lang, "loading"),
                          )
                        : null,
                    // Export PNG overlay
                    exportingPng && !isLoading
                        ? h(
                              "div",
                              { className: "export-spinner-overlay" },
                              h("div", { className: "loading-spinner" }),
                              t(lang, "exportingPng"),
                          )
                        : null,
                    // P0.3: Status bar
                    h(StatusBar, {
                        nodeCount: nodes.length,
                        edgeCount: edges.length,
                        zoom,
                        storageMode,
                        lang,
                    }),
                    // Req 8: Panel is conditionally rendered
                    // P0.2: Wrap panel with mobile close button
                    panelVisible
                        ? h(
                              "div",
                              { className: "panel-wrapper" },
                              h(
                                  "button",
                                  {
                                      className: "panel-close-btn",
                                      onClick: () => setPanelVisible(false),
                                      title: t(lang, "closePanel"),
                                      "aria-label": t(lang, "closePanelAria"),
                                  },
                                  h(
                                      "span",
                                      { className: "material-icon" },
                                      "close",
                                  ),
                              ),
                              panel,
                          )
                        : null,
                );
            }

            // ---------------------------------------------------------------------
            // ---- Self-tests ----
            // ---------------------------------------------------------------------

            function runSelfTests() {
                const assert = (condition, message) => {
                    if (!condition) throw new Error(message);
                };

                const handles = buildConnectedHandles([
                    {
                        source: "1",
                        sourceHandle: "s-r-50",
                        target: "2",
                        targetHandle: "t-l-50",
                    },
                    { source: "2", target: "3" },
                ]);
                assert(
                    handles.has("1|s-r-50"),
                    "buildConnectedHandles: source handle missing",
                );
                assert(
                    handles.has("2|t-l-50"),
                    "buildConnectedHandles: target handle missing",
                );
                assert(
                    handles.size === 2,
                    "buildConnectedHandles: unexpected handle count",
                );

                const validDoc = JSON.stringify({
                    nodes: [
                        {
                            id: "1",
                            position: { x: 0, y: 0 },
                            data: { label: "A" },
                        },
                        {
                            id: "2",
                            position: { x: 10, y: 10 },
                            data: { label: "B" },
                        },
                    ],
                    edges: [{ id: "e1-2", source: "1", target: "2" }],
                    canvasBg: "#fff",
                    canvasDot: "#ddd",
                });
                assert(
                    validateImport(validDoc).valid,
                    "validateImport: valid doc rejected",
                );
                assert(
                    !validateImport("{").valid,
                    "validateImport: invalid JSON accepted",
                );
                assert(
                    !validateImport(
                        JSON.stringify({
                            nodes: [],
                            edges: [{ id: "e", source: "x", target: "y" }],
                        }),
                    ).valid,
                    "validateImport: orphan edge accepted",
                );
                assert(
                    !validateImport(
                        JSON.stringify({
                            nodes: [
                                { id: "1", position: { x: 0, y: 0 }, data: {} },
                                { id: "1", position: { x: 1, y: 1 }, data: {} },
                            ],
                            edges: [],
                        }),
                    ).valid,
                    "validateImport: duplicate node id accepted",
                );

                const documentBoundary = appStateToDocument({
                    nodes: [
                        {
                            id: "1",
                            type: "mind",
                            position: { x: 1, y: 2 },
                            selected: true,
                            data: {
                                label: "A",
                                color: "Bleu",
                                shape: "pill",
                                connectedHandles: new Set(),
                                onCommit: () => {},
                            },
                        },
                    ],
                    edges: [
                        {
                            id: "e1",
                            source: "1",
                            target: "1",
                            selected: true,
                            style: { stroke: "#1e40af", strokeWidth: 2 },
                        },
                    ],
                    canvasBg: "#ffffff",
                    canvasDot: "#e6e6e6",
                });
                assert(
                    documentBoundary._version === STORAGE_SCHEMA_VERSION,
                    "appStateToDocument: missing schema version",
                );
                assert(
                    documentBoundary.nodes[0].selected === undefined,
                    "appStateToDocument: leaked UI node selection",
                );
                assert(
                    documentBoundary.nodes[0].data.onCommit === undefined,
                    "appStateToDocument: leaked callback into document",
                );
                assert(
                    documentBoundary.nodes[0].data.connectedHandles ===
                        undefined,
                    "appStateToDocument: leaked connected handles into document",
                );
                assert(
                    documentToAppState(documentBoundary).nodes[0].type ===
                        "mind",
                    "documentToAppState: missing default mind node type",
                );

                const reducedWithNode = reduceMindmapState(
                    createDefaultState(),
                    {
                        type: "UPDATE_NODE_DATA",
                        id: "1",
                        patch: { label: "Centre" },
                    },
                );
                assert(
                    reducedWithNode.nodes.find((n) => n.id === "1").data
                        .label === "Centre",
                    "reduceMindmapState: node data update failed",
                );
                const reducedWithoutNode = reduceMindmapState(reducedWithNode, {
                    type: "DELETE_NODE",
                    id: "1",
                });
                assert(
                    !reducedWithoutNode.nodes.some((n) => n.id === "1"),
                    "reduceMindmapState: node deletion failed",
                );
                assert(
                    !reducedWithoutNode.edges.some(
                        (e) => e.source === "1" || e.target === "1",
                    ),
                    "reduceMindmapState: incident edges not deleted",
                );

                const migrated = migrateSchema({
                    nodes: [{ id: "1", position: { x: 0, y: 0 }, data: {} }],
                    edges: [],
                });
                assert(
                    migrated.version === STORAGE_SCHEMA_VERSION,
                    "migrateSchema: wrong target version",
                );
                assert(
                    migrated.data.nodes[0].data.shape === "rectangle",
                    "migrateSchema: missing default shape",
                );

                const history = createHistoryManager({
                    nodes: [],
                    edges: [],
                    canvasBg: "#fff",
                    canvasDot: "#ddd",
                });
                history.push({
                    nodes: [{ id: "1" }],
                    edges: [],
                    canvasBg: "#fff",
                    canvasDot: "#ddd",
                });
                assert(
                    history.canUndo(),
                    "HistoryManager: canUndo false after push",
                );
                assert(
                    history.undo().nodes.length === 0,
                    "HistoryManager: undo did not restore initial state",
                );
                assert(
                    history.redo().nodes.length === 1,
                    "HistoryManager: redo did not restore pushed state",
                );

                const snap = computeSnap(
                    {
                        id: "drag",
                        position: { x: 94, y: 0 },
                        width: 140,
                        height: 44,
                    },
                    [
                        nodeBox({
                            id: "target",
                            position: { x: 100, y: 0 },
                            width: 140,
                            height: 44,
                        }),
                    ],
                );
                assert(
                    snap.dx === 6,
                    "computeSnap: expected x snap delta of 6",
                );

                // Test: grid snap logic (GRID_CELL_SIZE = 10)
                const gridSnapX = (x) =>
                    Math.round(x / GRID_CELL_SIZE) * GRID_CELL_SIZE;
                assert(
                    gridSnapX(94) === 90,
                    "Grid snap: 94 should snap to 90 (9*10)",
                );
                assert(
                    gridSnapX(106) === 110,
                    "Grid snap: 106 should snap to 110 (11*10)",
                );
                assert(gridSnapX(0) === 0, "Grid snap: 0 stays 0");
                assert(gridSnapX(14) === 10, "Grid snap: 14 should snap to 10");
                assert(GRID_CELL_SIZE === 10, "Grid cell size is 10px");

                // Test: copy-paste via deepClone
                const origNode = {
                    id: "42",
                    type: "mind",
                    position: { x: 100, y: 200 },
                    data: { label: "Test", color: "Bleu", shape: "rectangle" },
                };
                const cloned = deepClone(origNode);
                assert(cloned.id === "42", "deepClone: id preserved");
                assert(
                    cloned.position.x === 100,
                    "deepClone: position preserved",
                );
                cloned.position.x = 999;
                assert(
                    origNode.position.x === 100,
                    "deepClone: original not mutated",
                );

                // Test: selectionMode on ReactFlow is partial
                assert(
                    typeof "partial" === "string",
                    "selectionMode: partial mode configured",
                );

                console.info("Mindmap self-tests passed");
            }

            if (new URLSearchParams(window.location.search).has("test")) {
                runSelfTests();
            }

            const root = createRoot(document.getElementById("root"));
            root.render(
                h(
                    React.StrictMode,
                    null,
                    h(ReactFlowProvider, null, h(App, null)),
                ),
            );
        </script>
    </body>
</html>
