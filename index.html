<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Interactive mindmap editor based on React Flow, with local save, JSON import/export and PNG export."
        />
        <meta name="theme-color" content="#f7f6f2" />
        <!--
            Content Security Policy: restrict external resources for safety.
            inline styles/scripts are required by the mono-file architecture.
            For production deployment behind a server, add headers too:
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://esm.sh https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src *;"
        />
        <title>Mindmap — React Flow</title>
        <link
            rel="stylesheet"
            href="https://esm.sh/@xyflow/react@12/dist/style.css"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        />
        <style>
            :root {
                color-scheme: light;
                --bg: #f7f6f2;
                --text: #1a1915;
                --text-muted: #3c3930;
                --border: #d8d4cb;
                --panel-bg: #fff;
                --toolbar-bg: #fff;
                --toolbar-btn-bg: #f5f3ee;
                --toolbar-btn-hover: #ebe8e0;
                --toolbar-primary: #1e40af;
                --toolbar-primary-hover: #1d4ed8;
                --shadow: rgba(0, 0, 0, 0.06);
                --hint-bg: #fff;
                --save-bg: #fff;
                --kbd-bg: #f5f3ee;
                --panel-heading: #1a1915;
                --panel-label: #706c62;
                --panel-empty: #9e9a90;
                --panel-input-bg: #fff;
                --focus-ring: rgba(30, 64, 175, 0.15);
                --focus-border: #1e40af;
                --danger-bg: #fef2f0;
                --danger-text: #c0503a;
                --danger-border: #f0c5bb;
                --danger-hover: #fce5e0;
                --swatch-border: #d8d4cb;
                --swatch-active: #1e40af;
                --node-bg: #fff;
                --node-shadow: rgba(0, 0, 0, 0.08);
                --node-selected-shadow: rgba(30, 64, 175, 0.25);
                --node-desc: #706c62;
                --node-editable-hover: rgba(255, 255, 255, 0.55);
                --node-editable-focus: #fff;
                --handle-color: #1e40af;
                --handle-hover: #2563eb;
                --handle-border: #fff;
                --edge-label-bg: #fff;
                --edge-label-text: #1a1915;
                --statusbar-bg: #fff;
                --statusbar-text: #706c62;
                --minimap-bg: #f7f6f2;
                --minimap-node: #1e40af;
                --minimap-viewport: rgba(30, 64, 175, 0.1);
            }
            /* Dark theme */
            [data-theme="dark"] {
                color-scheme: dark;
                --bg: #1a1a1a;
                --text: #e8e6e0;
                --text-muted: #b0aca0;
                --border: #3a3832;
                --panel-bg: #242424;
                --toolbar-bg: #242424;
                --toolbar-btn-bg: #2e2e2e;
                --toolbar-btn-hover: #3a3a3a;
                --toolbar-primary: #60a5fa;
                --toolbar-primary-hover: #93bbfd;
                --shadow: rgba(0, 0, 0, 0.3);
                --hint-bg: #242424;
                --save-bg: #242424;
                --kbd-bg: #2e2e2e;
                --panel-heading: #e8e6e0;
                --panel-label: #b0aca0;
                --panel-empty: #706c62;
                --panel-input-bg: #2e2e2e;
                --focus-ring: rgba(96, 165, 250, 0.25);
                --focus-border: #60a5fa;
                --danger-bg: #3a2020;
                --danger-text: #e07060;
                --danger-border: #5a3030;
                --danger-hover: #4a2828;
                --swatch-border: #3a3832;
                --swatch-active: #60a5fa;
                --node-bg: #2e2e2e;
                --node-shadow: rgba(0, 0, 0, 0.3);
                --node-selected-shadow: rgba(96, 165, 250, 0.4);
                --node-desc: #b0aca0;
                --node-editable-hover: rgba(255, 255, 255, 0.08);
                --node-editable-focus: #3a3a3a;
                --handle-color: #60a5fa;
                --handle-hover: #93bbfd;
                --handle-border: #242424;
                --edge-label-bg: #2e2e2e;
                --edge-label-text: #e8e6e0;
                --statusbar-bg: #242424;
                --statusbar-text: #b0aca0;
                --minimap-bg: #1a1a1a;
                --minimap-node: #60a5fa;
                --minimap-viewport: rgba(96, 165, 250, 0.15);
            }
            /* Light theme (default) */
            html,
            body,
            #root {
                width: 100%;
                height: 100%;
                margin: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                transition:
                    background-color 200ms ease,
                    color 200ms ease;
            }
            #app-root {
                display: grid;
                grid-template-columns: 320px 1fr;
                width: 100%;
                height: 100%;
                transition: grid-template-columns 200ms ease;
            }
            #app-root.panel-hidden {
                grid-template-columns: 0px 1fr;
            }
            #app-root.panel-hidden .panel {
                width: 0;
                padding: 0;
                overflow: hidden;
                border: none;
            }
            /* P0.2: panel-wrapper — normal flow on desktop, fixed bottom-sheet on mobile */
            .panel-wrapper {
                display: block;
                height: 100%;
                overflow: hidden;
                grid-column: 1;
                grid-row: 1;
            }
            .panel-wrapper .panel {
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            .panel-wrapper .panel-close-btn {
                display: none;
            }
            .canvas {
                position: relative;
                min-width: 0;
                height: 100%;
                touch-action: manipulation;
                grid-column: 2;
                grid-row: 1;
            }
            .react-flow__pane {
                touch-action: manipulation;
            }

            /* P0.2: Mobile responsive panel (bottom-sheet) */
            @media (max-width: 768px) {
                #app-root {
                    grid-template-columns: 1fr;
                }
                /* On mobile, wrapper becomes a real block (no longer contents) */
                .panel-wrapper {
                    display: block;
                    position: fixed;
                    bottom: 0;
                    left: 0;
                    right: 0;
                    width: 100%;
                    height: 60%;
                    background: var(--panel-bg);
                    border-top: 1px solid var(--border);
                    border-radius: 12px 12px 0 0;
                    transform: translateY(100%);
                    transition: transform 300ms cubic-bezier(0.2, 0, 0, 1);
                    z-index: 50;
                    box-shadow: 0 -4px 12px var(--shadow);
                    overflow: hidden;
                }
                #app-root.panel-visible .panel-wrapper {
                    transform: translateY(0);
                }
                #app-root.panel-hidden .panel-wrapper {
                    transform: translateY(100%);
                }
                /* Backdrop for mobile panel */
                .panel-backdrop {
                    display: none;
                    position: fixed;
                    inset: 0;
                    background: rgba(0, 0, 0, 0.4);
                    z-index: 40;
                    opacity: 0;
                    transition: opacity 300ms ease;
                }
                #app-root.panel-visible .panel-backdrop {
                    display: block;
                    opacity: 1;
                }
                /* Close button for mobile */
                .panel-close-btn {
                    position: absolute;
                    top: 12px;
                    right: 12px;
                    width: 32px;
                    height: 32px;
                    border: none;
                    background: var(--toolbar-btn-bg);
                    color: var(--text);
                    border-radius: 50%;
                    cursor: pointer;
                    font-size: 18px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 51;
                }
                .panel-close-btn:hover {
                    background: var(--toolbar-btn-hover);
                }
                /* Hide close button on desktop */
                @media (min-width: 769px) {
                    .panel-close-btn {
                        display: none;
                    }
                }
            }
            @media (min-width: 769px) {
                .panel-backdrop {
                    display: none !important;
                }
            }
            .panel-backdrop {
                grid-column: 2;
                grid-row: 1;
            }

            .toolbar {
                position: absolute;
                top: 12px;
                left: 12px;
                z-index: 10;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                background: var(--toolbar-bg);
                padding: 6px 8px;
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: 0 2px 8px var(--shadow);
                max-width: calc(100vw - 24px);
            }
            @media (max-width: 480px) {
                .toolbar {
                    top: 8px;
                    left: 8px;
                    right: 8px;
                    gap: 4px;
                    padding: 5px 6px;
                }
                .toolbar button {
                    padding: 5px 8px;
                    font-size: 12px;
                }
            }
            .toolbar button {
                font: inherit;
                padding: 6px 12px;
                border: 1px solid var(--border);
                background: var(--toolbar-btn-bg);
                color: var(--text);
                border-radius: 5px;
                cursor: pointer;
            }
            .toolbar button:hover {
                background: var(--toolbar-btn-hover);
                transform: scale(1.05);
            }
            /* P2.8: Counter badge in toolbar */
            .toolbar-badge {
                display: inline-block;
                font-size: 10px;
                font-family: ui-monospace, "JetBrains Mono", monospace;
                padding: 1px 6px;
                border-radius: 8px;
                margin-left: 4px;
                background: var(--toolbar-btn-bg);
                color: var(--text-muted);
                border: 1px solid var(--border);
                pointer-events: none;
            }
            .toolbar button.primary .toolbar-badge {
                background: rgba(255, 255, 255, 0.2);
                color: #fff;
                border-color: transparent;
            }
            .toolbar button:active {
                transform: scale(0.98);
            }
            .toolbar button.primary {
                background: var(--toolbar-primary);
                color: #fff;
                border-color: var(--toolbar-primary);
            }
            .toolbar button.primary:hover {
                background: var(--toolbar-primary-hover);
            }
            .hint {
                position: absolute;
                bottom: 12px;
                left: 12px;
                z-index: 10;
                max-width: calc(100vw - 24px);
                background: var(--hint-bg);
                padding: 8px 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 12px;
                color: var(--text-muted);
                max-width: 380px;
                line-height: 1.5;
            }
            /* Save indicator toast (bottom-right of canvas) */
            .save-indicator {
                position: absolute;
                bottom: 12px;
                right: 12px;
                z-index: 10;
                background: var(--save-bg);
                padding: 6px 12px;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 12px;
                color: var(--text-muted);
                box-shadow: 0 2px 8px var(--shadow);
                pointer-events: none;
                transition: opacity 150ms ease;
            }
            .save-indicator.success {
                color: var(--toolbar-primary);
                border-color: var(--toolbar-primary);
            }
            .save-indicator.error {
                color: var(--danger-text);
                border-color: var(--danger-border);
                background: var(--danger-bg);
            }
            kbd {
                background: var(--kbd-bg);
                border: 1px solid var(--border);
                border-radius: 3px;
                padding: 1px 5px;
                font-size: 11px;
                font-family: ui-monospace, "JetBrains Mono", monospace;
            }

            /* Side panel */
            .panel {
                background: var(--panel-bg);
                border-right: 1px solid var(--border);
                padding: 16px;
                overflow-y: auto;
                font-size: 13px;
            }
            .panel h2 {
                margin: 0 0 12px;
                font-size: 12px;
                font-weight: 600;
                color: var(--panel-heading);
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }
            .panel .empty {
                color: var(--panel-empty);
                font-style: italic;
                font-size: 12px;
            }
            .panel .field {
                margin-bottom: 14px;
            }
            .panel label {
                display: block;
                font-size: 11px;
                font-weight: 600;
                color: var(--panel-label);
                text-transform: uppercase;
                letter-spacing: 0.04em;
                margin-bottom: 5px;
            }
            .panel input[type="text"],
            .panel input[type="number"],
            .panel textarea,
            .panel select {
                width: 100%;
                font: inherit;
                padding: 6px 8px;
                border: 1px solid var(--border);
                border-radius: 5px;
                background: var(--panel-input-bg);
                color: var(--text);
                box-sizing: border-box;
            }
            .panel textarea {
                min-height: 70px;
                resize: vertical;
            }
            .panel input:focus,
            .panel textarea:focus,
            .panel select:focus {
                outline: none;
                border-color: var(--focus-border);
                box-shadow: 0 0 0 2px var(--focus-ring);
            }
            .panel .row {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .panel .row > * {
                flex: 1;
            }
            .panel .check {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: var(--text-muted);
            }
            .panel .check input {
                width: auto;
            }

            .swatches {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .swatch {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid var(--panel-bg);
                box-shadow: 0 0 0 1px var(--swatch-border);
                cursor: pointer;
                padding: 0;
            }
            .swatch.active {
                box-shadow: 0 0 0 2px var(--swatch-active);
            }
            /* Req 9: Visible focus outline for accessibility */
            .swatch:focus {
                outline: 2px solid var(--swatch-active);
                outline-offset: 2px;
            }
            .danger {
                background: var(--danger-bg);
                color: var(--danger-text);
                border: 1px solid var(--danger-border);
                padding: 6px 12px;
                border-radius: 5px;
                cursor: pointer;
                font: inherit;
                width: 100%;
            }
            .danger:hover {
                background: var(--danger-hover);
            }
            .meta {
                font-family: ui-monospace, "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--panel-empty);
            }

            /* Custom node */
            .mind-node {
                position: relative;
                padding: 10px 14px;
                border-radius: 8px;
                border: 2px solid;
                background: var(--node-bg);
                font-size: 13px;
                line-height: 1.3;
                min-width: 90px;
                text-align: center;
                box-shadow: 0 1px 3px var(--node-shadow);
                color: #1a1915;
            }
            .mind-node.is-selected {
                box-shadow:
                    0 0 0 4px var(--node-selected-shadow),
                    0 0 20px rgba(30, 64, 175, 0.15),
                    0 4px 16px var(--node-shadow);
                border-width: 3px;
                animation: node-select-pulse 400ms ease-out;
            }
            @keyframes node-select-pulse {
                0% {
                    box-shadow: 0 0 0 0 var(--node-selected-shadow);
                }
                50% {
                    box-shadow: 0 0 0 6px var(--node-selected-shadow);
                }
                100% {
                    box-shadow: 0 0 0 3px var(--node-selected-shadow);
                }
            }
            /* Node shape variants (Req 7) */
            .mind-node.is-circle {
                border-radius: 50%;
            }
            .mind-node.is-diamond {
                border-radius: 4px;
                transform: rotate(45deg);
            }
            .mind-node.is-diamond .title,
            .mind-node.is-diamond .desc {
                transform: rotate(-45deg);
            }
            .mind-node.is-pill {
                border-radius: 50px;
            }
            .mind-node .desc {
                margin-top: 4px;
                font-size: 11px;
                color: var(--node-desc);
                font-style: italic;
                white-space: pre-wrap;
            }
            .mind-node .editable {
                outline: none;
                cursor: text;
                border-radius: 3px;
                min-width: 0;
                min-height: 0;
            }
            .mind-node.is-selected .editable {
                background: var(--node-editable-hover);
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
            }
            .mind-node .editable:focus {
                background: var(--node-editable-focus);
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3);
            }
            .mind-node .editable.empty::before {
                content: attr(data-placeholder);
                color: rgba(0, 0, 0, 0.3);
                font-style: italic;
            }

            /* Handles: invisible by default, shown only when connected or hovered.
         The DOM element keeps a generous hit area (14px) so the user can
         find it by moving the cursor near a node edge. */
            .react-flow__handle {
                width: 14px;
                height: 14px;
                background: transparent;
                border: none;
                opacity: 1;
                transition:
                    background 120ms ease,
                    border-color 120ms ease;
            }
            .react-flow__handle::after {
                content: "";
                position: absolute;
                inset: 3px;
                border-radius: 50%;
                background: var(--handle-color);
                border: 2px solid var(--handle-border);
                opacity: 0;
                transition: opacity 120ms ease;
                pointer-events: none;
            }
            .react-flow__handle.handle-connected::after,
            .react-flow__handle:hover::after {
                opacity: 1;
            }
            .react-flow__handle:hover::after {
                background: var(--handle-hover);
            }
            /* The transparent overlay-target handles never show a dot. */
            .react-flow__handle.handle-target-overlay::after {
                display: none;
            }
            /* Edge labels: explicit styles so html-to-image copies them into the
         exported SVG. Without these, the default React Flow styles live in a
         stylesheet the cloning algorithm can miss, so the SVG defaults kick in
         (fill: black) and you get a big black square instead of a label. */
            .react-flow__edge-textbg {
                fill: var(--edge-label-bg);
            }
            .react-flow__edge-text {
                fill: var(--edge-label-text);
                font-size: 11px;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
            }

            /* Status bar (P0.3) */
            .status-bar {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                grid-column: 2;
                z-index: 5;
                background: var(--statusbar-bg);
                border-top: 1px solid var(--border);
                padding: 4px 12px;
                font-size: 11px;
                color: var(--statusbar-text);
                display: flex;
                gap: 12px;
                align-items: center;
                font-family: ui-monospace, "JetBrains Mono", monospace;
                flex-wrap: wrap;
            }
            @media (max-width: 480px) {
                .status-bar {
                    font-size: 10px;
                    gap: 8px;
                    padding: 3px 8px;
                }
            }
            .status-bar .separator {
                width: 1px;
                height: 12px;
                background: var(--border);
            }

            /* P1.4: Hint close button */
            .hint-close {
                position: absolute;
                top: 4px;
                right: 4px;
                width: 24px;
                height: 24px;
                padding: 0;
                border: none;
                background: transparent;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 14px;
                line-height: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
            }
            .hint-close:hover {
                background: var(--toolbar-btn-hover);
            }

            /* P1.4: Hint recall toggle button */
            .hint-toggle {
                position: absolute;
                bottom: 12px;
                left: 12px;
                z-index: 10;
                width: 32px;
                height: 32px;
                padding: 0;
                border: 1px solid var(--border);
                background: var(--hint-bg);
                color: var(--text-muted);
                border-radius: 50%;
                cursor: pointer;
                font-size: 16px;
                box-shadow: 0 2px 8px var(--shadow);
            }
            .hint-toggle:hover {
                background: var(--toolbar-btn-hover);
            }

            /* Loading overlay (P1.6) */
            .loading-overlay {
                position: absolute;
                inset: 0;
                grid-column: 2;
                z-index: 100;
                background: var(--bg);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                font-size: 14px;
                color: var(--text-muted);
            }
            .loading-spinner {
                width: 32px;
                height: 32px;
                border: 3px solid var(--border);
                border-top-color: var(--toolbar-primary);
                border-radius: 50%;
                animation: spin 600ms linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* PNG watermark */
            .png-watermark {
                position: absolute;
                bottom: 12px;
                right: 16px;
                font-size: 11px;
                font-family: ui-monospace, "JetBrains Mono", monospace;
                color: rgba(0, 0, 0, 0.15);
                pointer-events: none;
                z-index: 100;
                white-space: nowrap;
            }

            /* Export spinner overlay */
            .export-spinner-overlay {
                position: absolute;
                inset: 0;
                z-index: 200;
                background: rgba(255, 255, 255, 0.7);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                font-size: 14px;
                color: var(--text-muted);
            }

            /* Storage indicator dot */
            .storage-dot {
                display: inline-block;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                margin-right: 6px;
            }
            .storage-dot.idb {
                background: #2ecc71;
            }
            .storage-dot.local {
                background: #f39c12;
            }

            /* Toggle switch */
            .toggle-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 12px;
            }
            .toggle-switch {
                position: relative;
                width: 40px;
                height: 22px;
            }
            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .toggle-slider {
                position: absolute;
                cursor: pointer;
                inset: 0;
                background: var(--border);
                border-radius: 22px;
                transition: background 200ms;
            }
            .toggle-slider::before {
                content: "";
                position: absolute;
                height: 16px;
                width: 16px;
                left: 3px;
                bottom: 3px;
                background: #fff;
                border-radius: 50%;
                transition: transform 200ms;
            }
            .toggle-switch input:checked + .toggle-slider {

            function migrateSchema(parsed) {
                let data = parsed;
                let version = parsed?._version ?? 1;

                if (typeof data !== "object" || data === null) {
                    return { data, version };

                // v1 → v2: ensure canvasBg/canvasDot exist
                if (version < 2) {
                    data = {
                        ...data,
                        canvasBg: data.canvasBg ?? "#f7f6f2",
                        canvasDot: data.canvasDot ?? "#d8d4cb",

                    version = 2;

                if (version < 3) {

            /**
             * Pure HistoryManager: manages past/present/future snapshots.
             * @param {any} initialState
             * @returns {{push: Function, undo: Function, redo: Function, canUndo: Function, canRedo: Function, getState: Function, setState: Function, clear: Function}}
             */
            function createHistoryManager(initialState) {
                const past = [];
                let present = deepClone(initialState);
                const future = [];

                return {
                    push(newState) {
                        past.push(deepClone(present));
                        if (past.length > HISTORY_MAX) past.shift();
                        present = deepClone(newState);
                        future.length = 0; // Clear redo stack on new action
                    },
                    undo() {
                        if (past.length === 0) return null;
                        future.push(deepClone(present));
                        present = past.pop();
                        return deepClone(present);
                    },
                    redo() {
                        if (future.length === 0) return null;
                        past.push(deepClone(present));
                        present = future.pop();
                        return deepClone(present);
                    },
                    canUndo() {
                        return past.length > 0;
                    },
                    canRedo() {
                        return future.length > 0;
                    },
                    getState() {
                        return deepClone(present);
                    },
                    setState(newState) {
                        present = deepClone(newState);
                    },
                    clear() {
                        past.length = 0;
                        future.length = 0;
                    },
                };

                const set = new Set();
                for (const e of edges) {
                    if (e.sourceHandle)
                        set.add(`${e.source}|${e.sourceHandle}`);
                    if (e.targetHandle)
                        set.add(`${e.target}|${e.targetHandle}`);
                }
                return set;
            }

            // Req 11: Extract nodeBox and computeSnap to module scope for testability
            const SNAP_PX = 6;
            const GRID_CELL_SIZE = 10;

            /**
             * Compute bounding box of a node for snap calculations.
             * @param {any} n - Node object
             * @returns {{id: string, x: number, y: number, w: number, h: number, cx: number, cy: number, r: number, b: number}}
             */
            function nodeBox(n) {
                const w = n.measured?.width ?? n.width ?? 140;
                const hh = n.measured?.height ?? n.height ?? 44;
                const x = n.position.x,
                    y = n.position.y;
                return {
                    id: n.id,
                    x,
                    y,
                    w,
                    h: hh,
                    cx: x + w / 2,
                    cy: y + hh / 2,
                    r: x + w,
                    b: y + hh,
                };
            }

            /**
             * Build a simple uniform grid index for spatial queries.
             * @param {any[]} boxes
             * @param {number} cellSize
             * @returns {Map<string, any[]>}
             */
            function buildGridIndex(boxes, cellSize) {
                const grid = new Map();
                for (const b of boxes) {
                    const minX = Math.floor(b.x / cellSize);
                    const maxX = Math.floor(b.r / cellSize);
                    const minY = Math.floor(b.y / cellSize);
                    const maxY = Math.floor(b.b / cellSize);
                    for (let gx = minX; gx <= maxX; gx++) {
                        for (let gy = minY; gy <= maxY; gy++) {
                            const key = `${gx},${gy}`;
                            const cell = grid.get(key);
                            if (cell) {
                                cell.push(b);
                            } else {
                                grid.set(key, [b]);
                            }
                        }
                    }
                }
                return grid;
            }

            /**
             * Query the grid for boxes near a given bounding box.
             * @param {Map<string, any[]>} grid
             * @param {any} box
             * @param {number} cellSize
             * @returns {Set<any>}
             */
            function queryGrid(grid, box, cellSize) {
                const results = new Set();
                const minX = Math.floor(box.x / cellSize) - 1;
                const maxX = Math.floor(box.r / cellSize) + 1;
                const minY = Math.floor(box.y / cellSize) - 1;
                const maxY = Math.floor(box.b / cellSize) + 1;
                for (let gx = minX; gx <= maxX; gx++) {
                    for (let gy = minY; gy <= maxY; gy++) {
                        const key = `${gx},${gy}`;
                        const cell = grid.get(key);
                        if (cell) {
                            for (const b of cell) results.add(b);
                        }
                    }
                }
                return results;
            }

            /**
             * Compute the best snap delta (dx, dy) and the candidate lists for a
             * given dragged node against all the others. Pure function.
             * Uses a spatial grid index to avoid O(n) scans on large graphs.
             * @param {any} draggedNode - The node being dragged
             * @param {any[]} others - Array of other node bounding boxes
             * @returns {{drag: any, dx: number, dy: number, vCands: any[], hCands: any[]}}
             */
            function computeSnap(draggedNode, others) {
                const drag = nodeBox(draggedNode);
                if (!others.length) {
                    return { drag, dx: 0, dy: 0, vCands: [], hCands: [] };
                }

                const candidates = queryGrid(
                    buildGridIndex(others, GRID_CELL_SIZE),
                    drag,
                    GRID_CELL_SIZE,
                );

                const vCands = [];
                const hCands = [];
                for (const t of candidates) {
                    const xs = [
                        [t.x - drag.x, t.x, t],
                        [t.cx - drag.cx, t.cx, t],
                        [t.r - drag.r, t.r, t],
                        [t.x - drag.r, t.x, t],
                        [t.r - drag.x, t.r, t],
                    ];
                    for (const c of xs)
                        if (Math.abs(c[0]) <= SNAP_PX) vCands.push(c);
                    const ys = [
                        [t.y - drag.y, t.y, t],
                        [t.cy - drag.cy, t.cy, t],
                        [t.b - drag.b, t.b, t],
                        [t.y - drag.b, t.y, t],
                        [t.b - drag.y, t.b, t],
                    ];
                    for (const c of ys)
                        if (Math.abs(c[0]) <= SNAP_PX) hCands.push(c);
                }
                const bestV = vCands.reduce(
                    (b, c) => (!b || Math.abs(c[0]) < Math.abs(b[0]) ? c : b),
                    null,
                );
                const bestH = hCands.reduce(
                    (b, c) => (!b || Math.abs(c[0]) < Math.abs(b[0]) ? c : b),
                    null,
                );
                return {
                    drag,
                    dx: bestV ? bestV[0] : 0,
                    dy: bestH ? bestH[0] : 0,
                    vCands,
                    hCands,
                };
            }

            // contentEditable wrapper that keeps the node's exact layout while
            // editing. We seed it with `defaultValue` and only commit on blur,
            // which avoids React clobbering the caret on each keystroke.
            function EditableText({
                value,
                placeholder,
                onCommit,
                className,
                multiline,
            }) {
                const ref = React.useRef(null);
                // Sync the DOM only when the external value diverges AND the field
                // is not currently focused (so external edits propagate, but typing
                // never gets reset under our feet).
                useEffect(() => {
                    const el = ref.current;
                    if (!el) return;
                    if (
                        document.activeElement !== el &&
                        el.textContent !== (value ?? "")
                    ) {
                        el.textContent = value ?? "";
                    }
                }, [value]);
                const isEmpty = !(value ?? "").length;
                return h(
                    "div",
                    {
                        ref,
                        className:
                            (className ?? "") +
                            " editable nodrag nopan" +
                            (isEmpty ? " empty" : ""),
                        contentEditable: true,
                        suppressContentEditableWarning: true,
                        spellCheck: false,
                        role: "textbox",
                        "aria-label": placeholder ?? "Texte éditable",
                        "aria-multiline": multiline ? "true" : "false",
                        "data-placeholder": placeholder,
                        onPointerDown: (e) => e.stopPropagation(),
                        onInput: (e) => {
                            // Toggle the empty class live so the placeholder reappears.
                            e.currentTarget.classList.toggle(
                                "empty",
                                e.currentTarget.textContent.length === 0,
                            );
                        },
                        onBlur: (e) => onCommit?.(e.currentTarget.textContent),
                        onKeyDown: (e) => {
                            if (!multiline && e.key === "Enter") {
                                e.preventDefault();
                                e.currentTarget.blur();
                            }
                            if (e.key === "Escape") {
                                e.currentTarget.blur();
                            }
                        },
                    },
                    value ?? "",
                );
            }

            const MindNode = memo(({ id, data, selected }) => {
                // Resolve colors: explicit bg/border win, otherwise fall back to the
                // named preset (legacy data) or default to Bleu.
                // Note: node colors are user content, NOT affected by dark mode.
                const preset =
                    COLORS.find((c) => c.name === data.color) ?? COLORS[0];
                const bg = data.bg ?? preset.bg;
                const border = data.border ?? preset.border;
                const shape = data.shape ?? "rectangle"; // Req 7: default shape
                const connected = data.connectedHandles ?? new Set();
                const onCommit = data.onCommit; // injected by the parent
                const handles = [];
                for (const { side, position } of SIDES) {
                    for (const pct of HANDLE_OFFSETS) {
                        const hid = `${side}-${pct}`;
                        const sourceId = `s-${hid}`;
                        const targetId = `t-${hid}`;
                        const styleAxis =
                            side === "t" || side === "b"
                                ? { left: `${pct}%` }
                                : { top: `${pct}%` };
                        const isConnected =
                            connected.has(`${id}|${sourceId}`) ||
                            connected.has(`${id}|${targetId}`);
                        handles.push(
                            h(Handle, {
                                key: sourceId,
                                id: sourceId,
                                type: "source",
                                position,
                                style: styleAxis,
                                className: isConnected
                                    ? "handle-connected"
                                    : "",
                            }),
                            h(Handle, {
                                key: targetId,
                                id: targetId,
                                type: "target",
                                position,
                                style: styleAxis,
                                className: "handle-target-overlay",
                            }),
                        );
                    }
                }

                // When selected, render inline editable fields. The "nodrag" /
                // "nopan" classes prevent React Flow from hijacking pointer events
                // so the user can actually type and select text.
                // When selected, only the title becomes inline-editable. The
                // description stays static here (and is edited via the side panel)
                // so the node never grows just because it gained focus — there's
                // no empty placeholder box appearing out of nowhere.
                const body = selected
                    ? [
                          h(NodeResizer, {
                              key: "resizer",
                              minWidth: 80,
                              minHeight: 36,

                              handleStyle: {

                          data.description
                              ? h(
                                    "div",
                                    { key: "desc", className: "desc" },
                                    data.description,
                                )
                              : null,
                      ]
                    : [
                          h(
                              "div",
                              { key: "title" },
                              data.label || "Untitled",
                          ),
                          data.description
                              ? h(
                                    "div",
                                    { key: "desc", className: "desc" },
                                    data.description,
                                )
                              : null,
                      ];

                // Req 7: apply shape class
                const SHAPE_CLASSES = {
                    circle: " is-circle",
                    diamond: " is-diamond",
                    pill: " is-pill",
                };
                const shapeClass = SHAPE_CLASSES[shape] ?? "";
                return h(
                    "div",
                    {
                        className:
                            "mind-node" +
                            (selected ? " is-selected" : "") +
                            shapeClass,
                        style: {
                            background: bg,
                            borderColor: border,
                            "--handle-color": border,
                        },

                    ...body,
                    ...handles,
