                const [editing, setEditing] = useState(null);
                const [name, setName] = useState("");
                const [endpoint, setEndpoint] = useState("");
                const [model, setModel] = useState("");
                const [key, setKey] = useState("");
                const [models, setModels] = useState([]);
                const [fetchingModels, setFetchingModels] = useState(false);
                const [testResult, setTestResult] = useState(null);
                const [testing, setTesting] = useState(false);
                const [contextSize, setContextSize] = useState(8192);

                const startEdit = (p) => {
                    setEditing(
                        p || {
                            id: "",
                            name: "",
                            endpoint: "http://localhost:11434/v1",
                            model: "",
                            key: "",
                        },
                    );
                    setName(p ? p.name : "");
                    setEndpoint(p ? p.endpoint : "http://localhost:11434/v1");
                    setModel(p ? p.model : "");
                    setKey(p ? p.key : "");
                    setContextSize(p ? p.contextSize || 8192 : 8192);
                    setModels([]);
                    setTestResult(null);
                };
                const cancelEdit = () => {
                    setEditing(null);
                    setTestResult(null);
                };

                const save = () => {
                    if (!name.trim() || !endpoint.trim()) return;
                    const p = {
                        id: editing.id || "p" + Date.now(),
                        name: name.trim(),
                        endpoint: endpoint.trim(),
                        model: model.trim(),
                        key: key.trim(),
                        contextSize: editing.contextSize || 8192,
                    };
                    const updated = aiProviders.some((x) => x.id === p.id)
                        ? aiProviders.map((x) => (x.id === p.id ? p : x))
                        : [...aiProviders, p];
                    setAiProviders(updated);
                    saveAiProviders(updated);
                    if (!activeProviderId) {
                        setActiveProviderId(p.id);
                        saveActiveProviderId(p.id);
                    }
                    setEditing(null);
                    setTestResult(null);
                };
                const remove = (id) => {
                    const updated = aiProviders.filter((x) => x.id !== id);
                    setAiProviders(updated);
                    saveAiProviders(updated);
                    if (activeProviderId === id) {
                        const n = updated[0]?.id || "";
                        setActiveProviderId(n);
                        saveActiveProviderId(n);
                    }
                };
                const handleFetchModels = async () => {
                    setFetchingModels(true);
                    setModels([]);
                    try {
                        const m = await fetchModels(endpoint, key);
                        setModels(m);
                    } catch (e) {
                        setModels([]);
                    } finally {
                        setFetchingModels(false);
                    }
                };
                const testConnection = async () => {
                    setTesting(true);
                    setTestResult(null);
                    const t0 = performance.now();
                    try {
                        const r = await callLLM(
                            endpoint,
                            model || undefined,
                            key || undefined,
                            "Réponds uniquement OK.",
                        );
                        setTestResult({
                            ok: r.toLowerCase().includes("ok"),
                            ms: Math.round(performance.now() - t0),
                        });
                    } catch (e) {
                        const msg = e.message || String(e);
                        const hint =
                            msg.includes("fetch") ||
                            msg.includes("CORS") ||
                            msg.includes("Failed to fetch")
                                ? " (CORS désactivé ? Voir aide ci-dessus)"
                                : "";
                        setTestResult({
                            ok: false,
                            ms: Math.round(performance.now() - t0),
                            error: msg + hint,
                        });
                    } finally {
                        setTesting(false);
                    }
                };

                const providerCards =
                    aiProviders.length === 0
                        ? [
                              h(
                                  "div",
                                  {
                                      key: "empty",
                                      className: "ai-settings-empty",
                                  },
                                  t(lang, "aiEmpty"),
                              ),
                          ]
                        : aiProviders.map((p) =>
                              h(
                                  "div",
                                  {
                                      key: p.id,
                                      className:
                                          "ai-provider-card" +
                                          (p.id === activeProviderId
                                              ? " active"
                                              : ""),
                                      onClick: () => {
                                          setActiveProviderId(p.id);
                                          saveActiveProviderId(p.id);
                                      },
                                  },
                                  h(
                                      "div",
                                      { className: "ai-provider-card-body" },
                                      h(
                                          "span",
                                          {
                                              className:
                                                  "ai-provider-card-name",
                                          },
                                          (p.id === activeProviderId
                                              ? "● "
                                              : "○ ") + p.name,
                                      ),
                                      h(
                                          "span",
                                          { className: "ai-provider-card-url" },
                                          p.model
                                              ? p.model + " · " + p.endpoint
                                              : p.endpoint,
                                      ),
                                  ),
                                  h(
                                      "button",
                                      {
                                          type: "button",
                                          className: "ai-provider-card-btn",
                                          onClick: (e) => {
                                              e.stopPropagation();
                                              startEdit(p);
                                          },
                                          title: "Edit",
                                      },
                                      h(
                                          "span",
                                          {
                                              className: "material-icon",
                                              style: { fontSize: 16 },
                                          },
                                          "edit",
                                      ),
                                  ),
                                  h(
                                      "button",
                                      {
                                          type: "button",
                                          className: "ai-provider-card-btn",
                                          onClick: (e) => {
                                              e.stopPropagation();
                                              remove(p.id);
                                          },
                                          title: "Delete",
                                      },
                                      h(
                                          "span",
                                          {
                                              className: "material-icon",
                                              style: { fontSize: 16 },
                                          },
                                          "delete",
                                      ),
                                  ),
                              ),
                          );

                const modelChips =
                    models.length > 0
                        ? h(
                              "div",
                              { className: "ai-model-list" },
                              models.slice(0, 20).map((m) =>
                                  h(
                                      "button",
                                      {
                                          key: m,
                                          type: "button",
                                          className:
                                              "ai-model-chip" +
                                              (m === model ? " active" : ""),
                                          onClick: () => setModel(m),
                                      },
                                      m,
                                  ),
                              ),
                          )
                        : null;

                const testBlock = testResult
                    ? h(
                          "div",
                          {
                              className:
                                  "ai-test-result " +
                                  (testResult.ok ? "ok" : "fail"),
                          },
                          testResult.ok
                              ? "✅ Connexion OK — " + testResult.ms + " ms"
                              : "❌ " + (testResult.error || "Échec"),
                      )
                    : null;

                const formBlock = editing
                    ? h(
                          "div",
                          { className: "ai-settings-form" },
                          h(
                              "div",
                              { className: "ai-settings-form-title" },
                              editing.id
                                  ? editing.id
                                      ? "Edit provider"
                                      : "New provider"
                                  : "New provider",
                          ),
                          h(
                              "div",
                              { className: "field" },
                              h("label", null, t(lang, "nodeLabel")),
                              h("input", {
                                  type: "text",
                                  value: name,
                                  onChange: (e) => setName(e.target.value),
                                  placeholder: "ex: Mon Ollama local",
                              }),
                          ),
                          h(
                              "div",
                              { className: "field" },
                              h("label", null, "API URL (OpenAI-compatible)"),
                              h("input", {
                                  type: "text",
                                  value: endpoint,
                                  onChange: (e) => {
                                      setEndpoint(e.target.value);
                                      setModels([]);
                                  },
                                  placeholder: "http://localhost:11434/v1",
                              }),
                              h(
                                  "div",
                                  { className: "ai-cors-hint" },
                                  "💡 Si l'API est en local (Ollama, LM Studio), active le CORS : ",
                                  "Ollama → lancer avec OLLAMA_ORIGINS=",
                                  h("code", null, "*"),
                                  " / LM Studio → Settings → CORS → Enable.",
                              ),
                          ),
                          h(
                              "div",
                              { className: "field" },
                              h("label", null, t(lang, "aiModel")),
                              h(
                                  "div",
                                  { className: "ai-model-row" },
                                  h("input", {
                                      type: "text",
                                      value: model,
                                      onChange: (e) => setModel(e.target.value),
                                      placeholder: "llama3.2",
                                      style: { flex: 1 },
                                  }),
                                  h(
                                      "button",
                                      {
                                          type: "button",
                                          className: "ai-fetch-btn",
                                          onClick: handleFetchModels,
                                          disabled: fetchingModels || !endpoint,
                                          title: "Fetch available models",
                                      },
                                      h(
                                          "span",
                                          {
                                              className: "material-icon",
                                              style: { fontSize: 16 },
                                          },
                                          fetchingModels
                                              ? "pending"
                                              : "cloud_download",
                                      ),
                                  ),
                              ),
                              modelChips,
                          ),
                          h(
                              "div",
                              { className: "field" },
                              h("label", null, "Context size (tokens)"),
                              h("input", {
                                  type: "number",
                                  value: contextSize,
                                  onChange: (e) =>
                                      setContextSize(
                                          parseInt(e.target.value) || 8192,
                                      ),
                                  min: 2048,
                                  max: 131072,
                                  step: 1024,
                                  placeholder: "8192",
                              }),
                              h(
                                  "div",
                                  {
                                      style: {
                                          fontSize: 10,
                                          color: "var(--text-muted)",
                                          marginTop: 2,
                                      },
                                  },
                                  "Défaut: 8192. Max dépend de ton modèle (ex: 32768 pour llama3, 131072 pour deepseek).",
                              ),
                          ),
                          h(
                              "div",
                              { className: "field" },
                              h("label", null, t(lang, "aiKey")),
                              h("input", {
                                  type: "password",
                                  value: key,
                                  onChange: (e) => setKey(e.target.value),
                                  placeholder: "sk-... or leave empty",
                              }),
                          ),
                          testBlock,
                          h(
                              "div",
                              { className: "ai-settings-form-actions" },
                              h(
                                  "button",
                                  {
                                      type: "button",
                                      className: "ai-test-btn",
                                      onClick: testConnection,
                                      disabled: testing || !endpoint,
                                  },
                                  h(
                                      "span",
                                      {
                                          className: "material-icon",
                                          style: {
                                              fontSize: 14,
                                              marginRight: 4,
                                          },
                                      },
                                      testing ? "pending" : "network_check",
                                  ),
                                  testing ? "Testing..." : "Test",
                              ),
                              h("div", { style: { flex: 1 } }),
                              h(
                                  "button",
                                  {
                                      type: "button",
                                      onClick: cancelEdit,
                                      className: "ai-cancel-btn",
                                  },
                                  t(lang, "aiCancel"),
                              ),
                              h(
                                  "button",
                                  {
                                      type: "button",
                                      onClick: save,
                                      disabled:
                                          !name.trim() || !endpoint.trim(),
                                      className: "ai-save-btn",
                                  },
                                  "Save",
                              ),
                          ),
                      )
                    : null;

                return h(
                    "div",
                    { className: "ai-settings" },
                    h("div", { className: "ai-settings-list" }, providerCards),
                    h(
                        "button",
                        {
                            type: "button",
                            className: "ai-settings-add",
                            onClick: () => startEdit(null),
                        },
                        h(
                            "span",
                            {
                                className: "material-icon",
                                style: { fontSize: 16, marginRight: 4 },
                            },
                            "add",
                        ),
                        "Add provider",
                    ),
                    formBlock,
                );
            }

            // ---- AI Sidebar ----
            function AiSidebar({
                open,
                nodes,
                edges,
                selectedNodeId,
                lang,
                activeDocId,
                aiProviders,
                setAiProviders,
                activeProviderId,
                setActiveProviderId,
                aiMessages,
                setAiMessages,
                onClose,
                onApplyPatches,
            }) {
                const [instruction, setInstruction] = useState("");
                const [loading, setLoading] = useState(false);
                const [error, setError] = useState(null);
                const [tab, setTab] = useState("chat"); // "chat" | "settings"
                const [thinkingCollapsed, setThinkingCollapsed] =
                    useState(true);
                const thinkingCollapsedRef = useRef(true);
                const taRef = useRef(null);
                const msgsRef = useRef(null);
                const abortRef = useRef(null);

                // Abort in-flight stream when sidebar closes
                useEffect(() => {
                    if (!open && abortRef.current) {
                        abortRef.current.abort();
                        abortRef.current = null;
                    }
                }, [open]);

                const activeProvider =
                    aiProviders.find((p) => p.id === activeProviderId) || null;

                useEffect(() => {
                    if (open && aiProviders.length === 0) setTab("settings");
                }, [open]);

                useEffect(() => {
                    if (msgsRef.current)
                        msgsRef.current.scrollTop =
                            msgsRef.current.scrollHeight;
                }, [aiMessages]);

                if (!open) return null;

                const handleGenerate = async () => {
                    if (!activeProvider) {
                        setError(
                            "No provider selected. Go to Settings and activate a provider (●).",
                        );
                        return;
                    }
                    if (!instruction.trim()) return;
                    setLoading(true);
                    setError(null);
                    const msg = instruction.trim();
                    setInstruction("");
                    setAiMessages((prev) => [
                        ...prev,
                        { role: "user", text: msg },
                    ]);
                    // Build system prompt with graph context
                    const sysContent =
                        "Tu es un assistant qui modifie une carte mentale via l'outil edit_mindmap. SCHÉMA ACTUEL :\n" +
                        JSON.stringify(
                            {
                                nodes: nodes.map((n) => ({
                                    id: n.id,
                                    label: n.data?.label || "",
                                    color: n.data?.color || "Bleu",
                                    shape: n.data?.shape || "rectangle",
                                    description: n.data?.description || "",
                                })),
                                edges: edges.map((e) => ({
                                    id: e.id,
                                    source: e.source,
                                    target: e.target,
                                    label: e.label || "",
                                })),
                            },
                            null,
                            2,
                        ) +
                        "\n\nHOW TO EDIT: 1) First, list ALL new nodes in nodes_to_add (id, label, color, shape, x, y). 2) Then, list edges in edges_to_add using node IDs. 3) To modify a node, use nodes_to_update. 4) To delete, use node_ids_to_delete or edge_ids_to_delete. 5) To remove an arrow, use edges_to_update with arrow:false. 6) ALWAYS respond with a text message BEFORE calling the tool. HANDLES (REQUIRED) : chaque edge DOIT avoir sourceHandle et targetHandle. Règle simple : si la cible est à DROITE → sourceHandle:s-r-50, targetHandle:t-l-50. Si à GAUCHE → sourceHandle:s-l-50, targetHandle:t-r-50. Si en BAS → sourceHandle:s-b-50, targetHandle:t-t-50. Si en HAUT → inverse. Varie les positions (25, 50, 75) si plusieurs edges vers la même direction. LAYOUT OBLIGATOIRE : every new node MUST have x and y. Place the main node at x:0, y:0. Main branches at 200px (e.g. x:200, x:-200, y:200, y:-200). Sub-nodes at 150px from parent. Example: {id:n1, label:Test, x:200, y:0}. Design: rectangle by default, circle for key concepts, diamond for decisions, pill for labels. Colors: " +
                        COLORS.map((c) => c.name).join(", ");

                    // Smart trim conversation history based on context budget
                    const contextLimit =
                        (activeProvider?.contextSize || 8192) * 4;
                    const sysSize = sysContent.length;
                    const budget = contextLimit - sysSize - 500;
                    const history = aiMessages
                        .filter((m) => m.role !== "thinking")
                        .map((m) => ({ role: m.role, content: m.text }));
                    let used = 0;
                    const kept = [];
                    for (let i = history.length - 1; i >= 0; i--) {
                        const sz = JSON.stringify(history[i]).length;
                        if (used + sz > budget) break;
                        kept.unshift(history[i]);
                        used += sz;
                    }

                    const messages = [
                        { role: "system", content: sysContent },
                        ...kept,
                        {
                            role: "user",
                            content:
                                msg +
                                "\n\n(Respond with a text message first, then use the tools.)",
                        },
                    ];
                    // Add placeholder for assistant response
                    const msgId = "msg_" + Date.now();
                    setAiMessages((prev) => [
                        ...prev,
                        { role: "assistant", text: "", msgId },
                    ]);
                    let thinking = "";
                    try {
                        let fullText = "";
                        let toolCalls = [];
                        for await (const chunk of streamLLM(
                            activeProvider.endpoint,
                            activeProvider.model,
                            activeProvider.key,
                            messages,
                            (t) => {
                                thinking += t;
                                setAiMessages((prev) => {
                                    const updated = [...prev];
                                    const thinkIdx = updated.findIndex(
                                        (m) => m.role === "thinking",
                                    );
                                    if (thinkIdx >= 0)
                                        updated[thinkIdx] = {
                                            role: "thinking",
                                            text: thinking,
                                        };
                                    else {
                                        const assistPos = updated.findIndex(
                                            (m) => m.msgId === msgId,
                                        );
                                        updated.splice(assistPos, 0, {
                                            role: "thinking",
                                            text: thinking,
                                        });
                                    }
                                    return updated;
                                });
                            },
                            abortRef.current
                                ? abortRef.current.signal
                                : undefined,
                        )) {
                            if (chunk.type === "text") {
                                fullText += chunk.text;
                                setAiMessages((prev) => {
                                    const updated = [...prev];
                                    const idx = updated.findIndex(
                                        (m) => m.msgId === msgId,
                                    );
                                    if (idx >= 0)
                                        updated[idx] = {
                                            role: "assistant",
                                            text: fullText,
                                            msgId,
                                        };
                                    return updated;
                                });
                            }
                            if (chunk.type === "tool_calls") {
                                toolCalls = chunk.calls;
                            }
                        }
                        // Execute tool calls if any, or try parsing content as patches
                        // Strip JSON blocks from displayed text
                        if (fullText) {
                            const cleaned = fullText
                                .replace(/\[[\s\S]*\]/g, "")
                                .trim();
                            if (cleaned && cleaned !== fullText) {
                                setAiMessages((prev) => {
                                    const updated = [...prev];
                                    const idx = updated.findIndex(
                                        (m) =>
                                            m.role === "assistant" &&
                                            m.text === fullText,
                                    );
                                    if (idx >= 0)
                                        updated[idx] = {
                                            role: "assistant",
                                            text: cleaned,
                                        };
                                    return updated;
                                });
                                fullText = cleaned;
                            }
                        }

                        if (!toolCalls.length && fullText) {
                            // Fallback: parse JSON patches from text, then clean display
                            const parsed = parsePatchResponse(fullText);
                            if (parsed && parsed.length) {
                                const v = validatePatches(parsed, {
                                    nodes,
                                    edges,
                                });
                                if (v.valid) {
                                    onApplyPatches(parsed, "");
                                }
                                // Clean JSON from displayed text
                                const cleaned = fullText
                                    .replace(/\[[\s\S]*\]/g, "")
                                    .trim();
                                if (cleaned) {
                                    setAiMessages((prev) => {
                                        const updated = [...prev];
                                        const idx = updated.findIndex(
                                            (m) =>
                                                m.role === "assistant" &&
                                                m.text === fullText,
                                        );
                                        if (idx >= 0)
                                            updated[idx] = {
                                                role: "assistant",
                                                text: cleaned,
                                            };
                                        return updated;
                                    });
                                }
                                if (!v.valid) {
                                    setAiMessages((prev) => {
                                        const updated = [...prev];
                                        const idx = updated.findIndex(
                                            (m) =>
                                                m.role === "assistant" &&
                                                m.text === fullText,
                                        );
                                        const errText =
                                            "\n\n❌ " + v.errors.join("\n");
                                        if (idx >= 0)
                                            updated[idx] = {
                                                role: "assistant",
                                                text: fullText + errText,
                                            };
                                        return updated;
                                    });
                                }
                            }
                        } else if (toolCalls.length) {
                            for (const tc of toolCalls) {
                                try {
                                    const args = JSON.parse(
                                        tc.arguments || "{}",
                                    );
                                    const result = executeToolCall(
                                        tc.name,
                                        args,
                                        { nodes, edges },
                                    );
                                    if (result.success && result.newState) {
                                        onApplyPatches(
                                            null,
                                            "",
                                            result.newState,
                                        );
                                        if (!fullText && thinking) {
                                            const lines = thinking
                                                .split("\n")
                                                .filter(
                                                    (l) =>
                                                        l.trim() &&
                                                        !l.includes('"op"') &&
                                                        !l.includes(
                                                            "edit_mindmap",
                                                        ),
                                                );
                                            const summary = lines
                                                .slice(-3)
                                                .join("\n")
                                                .trim();
                                            if (summary)
                                                setAiMessages((prev) => {
                                                    const u = [...prev];
                                                    const i = u.findIndex(
                                                        (m) =>
                                                            m.msgId === msgId,
                                                    );
                                                    if (i >= 0)
                                                        u[i] = {
                                                            role: "assistant",
                                                            text: summary,
                                                            msgId,
                                                        };
                                                    return u;
                                                });
                                        }
                                    } else {
                                        // Feed error back to model for correction
                                        const errText =
                                            "❌ " +
                                            (result.error || "Error") +
                                            ". Peux-tu corriger ?";
                                        setAiMessages((prev) => [
                                            ...prev,
                                            {
                                                role: "assistant",
                                                text: errText,
                                            },
                                        ]);
                                        // Retry with error context
                                        try {
                                            const retryMessages = [
                                                ...messages,
                                                {
                                                    role: "assistant",
                                                    content:
                                                        tc.name +
                                                        " a échoué : " +
                                                        (result.error ||
                                                            "Error"),
                                                },
                                                {
                                                    role: "user",
                                                    content:
                                                        "Corrige l'erreur et réessaie avec edit_mindmap.",
                                                },
                                            ];
                                            for await (const chunk of streamLLM(
                                                activeProvider.endpoint,
                                                activeProvider.model,
                                                activeProvider.key,
                                                retryMessages,
                                                undefined,
                                                abortRef.current?.signal,
                                            )) {
                                                if (
                                                    chunk.type === "tool_calls"
                                                ) {
                                                    for (const rc of chunk.calls) {
                                                        try {
                                                            const rargs =
                                                                JSON.parse(
                                                                    rc.arguments ||
                                                                        "{}",
                                                                );
                                                            const rresult =
                                                                executeToolCall(
                                                                    rc.name,
                                                                    rargs,
                                                                    {
                                                                        nodes,
                                                                        edges,
                                                                    },
                                                                );
                                                            if (
                                                                rresult.success &&
                                                                rresult.newState
                                                            ) {
                                                                onApplyPatches(
                                                                    null,
                                                                    "",
                                                                    rresult.newState,
                                                                );
                                                            } else {
                                                                setAiMessages(
                                                                    (prev) => [
                                                                        ...prev,
                                                                        {
                                                                            role: "assistant",
                                                                            text:
                                                                                "❌ " +
                                                                                (rresult.error ||
                                                                                    "Échec de la correction"),
                                                                        },
                                                                    ],
                                                                );
                                                            }
                                                        } catch (e2) {
                                                            setAiMessages(
                                                                (prev) => [
                                                                    ...prev,
                                                                    {
                                                                        role: "assistant",
                                                                        text:
                                                                            "❌ " +
                                                                            e2.message,
                                                                    },
                                                                ],
                                                            );
                                                        }
                                                    }
                                                }
                                            }
                                        } catch (e2) {
                                            setAiMessages((prev) => [
                                                ...prev,
                                                {
                                                    role: "assistant",
                                                    text: "❌ " + e2.message,
                                                },
                                            ]);
                                        }
                                    }
                                } catch (e) {
                                    setAiMessages((prev) => [
                                        ...prev,
                                        {
                                            role: "assistant",
                                            text:
                                                "❌ " + (e.message || "Error"),
                                        },
                                    ]);
                                }
                            }
                        }
                        if (!fullText && !toolCalls.length) {
                            // Model only output reasoning, use it as response
                            if (thinking) {
                                // Take the last meaningful part of the reasoning
                                const lines = thinking
                                    .split("\n")
                                    .filter((l) => l.trim());
                                const summary =
                                    lines.slice(-3).join("\n") ||
                                    thinking.slice(-500);
                                setAiMessages((prev) => {
                                    const updated = [...prev];
                                    updated[
                                        updated.findIndex(
                                            (m) => m.msgId === msgId,
                                        )
                                    ] = {
                                        role: "assistant",
                                        text: "💭 " + summary,
                                    };
                                    return updated;
                                });
                            } else {
                                setAiMessages((prev) => {
                                    const updated = [...prev];
                                    updated[
                                        updated.findIndex(
                                            (m) => m.msgId === msgId,
                                        )
                                    ] = {
                                        role: "assistant",
                                        text: "🤷 Aucune réponse.",
                                        msgId,
                                    };
                                    return updated;
                                });
                            }

                        setAiMessages((prev) => {
                            const updated = [...prev];
                            updated[
                                updated.findIndex((m) => m.msgId === msgId)
                            ] = {
                                role: "assistant",
                                text: "❌ " + (e.message || "Error"),
                                msgId,
                            };
                            return updated;
                        });
                    } finally {
                        setAiMessages((prev) =>
                            prev.filter(

                                    !(

                                        m.role === "assistant" &&
                                        !m.text

                        );

            function openDb() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(IDB_DB_NAME, IDB_VERSION);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(IDB_STORE_NAME)) {
                            db.createObjectStore(IDB_STORE_NAME);
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            /** Generate a short unique id */
            function uid() {
                return Math.random().toString(36).slice(2, 10);

            /** Load metadata: { activeDocId, docs: DocMeta[] } */
            async function loadDocMeta() {
                try {
                    const db = await openDb();
                    const tx = db.transaction(IDB_STORE_NAME, "readonly");
                    const req = tx
                        .objectStore(IDB_STORE_NAME)
                        .get(IDB_META_KEY);
                    return new Promise((resolve) => {
                        req.onsuccess = () => {
                            const result = req.result ?? {
                                activeDocId: null,
                                docs: [],
                            };
                            resolve(result);
                        };
                        req.onerror = () => {
                            resolve({ activeDocId: null, docs: [] });
                        };
                    });
                } catch (e) {
                    return { activeDocId: null, docs: [] };
                }
            }

            /** Save metadata */
            async function saveDocMeta(meta) {
                try {
                    const db = await openDb();
                    const tx = db.transaction(IDB_STORE_NAME, "readwrite");
                    tx.objectStore(IDB_STORE_NAME).put(meta, IDB_META_KEY);
                    return new Promise((resolve) => {
                        tx.oncomplete = () => {
                            resolve(true);
                        };
                        tx.onerror = () => {
                            resolve(false);
                        };
                        tx.onabort = () => {
                            resolve(false);
                        };
                    });
                } catch (e) {
                    return false;
                }
            }

            /** Save a document by id */
            async function saveDocById(id, doc) {
                try {
                    const db = await openDb();
                    const tx = db.transaction(IDB_STORE_NAME, "readwrite");
                    tx.objectStore(IDB_STORE_NAME).put(
                        doc,
                        IDB_DOC_PREFIX + id,
                    );
                    return new Promise((resolve) => {
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch {
                    return false;
                }
            }

            /** Load a document by id */
            async function loadDocById(id) {

            /** Load and validate a document (with migration) */
            function validateAndMigrateDoc(raw) {
                if (!raw) return null;
                let parsed = raw;
                if (typeof raw === "string") {
                    try {
                        parsed = JSON.parse(raw);
                    } catch {
                        return null;
                    }
                }
                if (!parsed?.nodes || !parsed?.edges) return null;
                const { data, version } = migrateSchema(parsed);
                const validation = validateDocument(data);
                if (!validation.valid) {
                    console.warn("Mindmap data ignored:", validation.error);
                    return null;
                }
                return { data: validation.data, version };
            }

            /** Migrate legacy single-document format to multi-doc */
            async function migrateLegacyIfNeeded() {
                try {
                    const legacyKey = "mindmap.flow.v3";
                    let raw = null;
                    // Check IndexedDB for old key
                    try {
                        const db = await openDb();
                        const tx = db.transaction(IDB_STORE_NAME, "readonly");
                        const req = tx
                            .objectStore(IDB_STORE_NAME)
                            .get(legacyKey);
                        raw = await new Promise((r) => {
                            req.onsuccess = () => r(req.result ?? null);
                            req.onerror = () => r(null);
                        });
                    } catch {}
                    // Fallback to localStorage
                    if (!raw) {
                        try {
                            raw = localStorage.getItem(legacyKey);
                        } catch {}
                    }
                    if (!raw) return false;
                    const result = validateAndMigrateDoc(raw);
                    if (!result) return false;
                    const id = uid();
                    const doc = { ...result.data, _version: result.version };
                    await saveDocById(id, doc);
                    const meta = {
                        activeDocId: id,
                        docs: [
                            {
                                id,
                                name: "Importé",
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString(),
                                nodeCount: doc.nodes.length,
                                edgeCount: doc.edges.length,
                            },
                        ],
                    };
                    await saveDocMeta(meta);
                    // Clean up legacy
                    try {
                        const db = await openDb();
                        const tx = db.transaction(IDB_STORE_NAME, "readwrite");
                        tx.objectStore(IDB_STORE_NAME).delete(legacyKey);
                    } catch {}
                    try {
                        localStorage.removeItem(legacyKey);
                    } catch {}
                    return true;
                } catch {
                    return false;
                }
            }
